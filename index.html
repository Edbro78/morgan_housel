const nb = n => {
  if (!Number.isFinite(n)) return "–";
  return Math.round(n).toLocaleString("nb-NO").replace(/\u00a0/g, " ");
};
const kr = n => Number.isFinite(n) ? nb(n) + " kr" : "–";
const mkr = n => {
  if (!Number.isFinite(n)) return "–";

const DEFAULTS = { salary: 0, taxFree: 0, cost: 10000, assets: 0, debt: 0, rate: 5, liq: 0, prate: 5, pensionCapital: 0 };

function num(v) {
  const n = Number(v);
  return Number.isFinite(n) ? n : 0;
}
function normalize(s) {
  s = s || {};
  return {
    salary: num(s.salary), taxFree: num(s.taxFree), cost: num(s.cost),
    assets: num(s.assets), debt: num(s.debt), rate: num(s.rate),
    liq: num(s.liq), prate: num(s.prate), pensionCapital: num(s.pensionCapital),
    ownRate: num(s.ownRate),
  };
}
function ownershipRate(s) {
  const r = num(s && s.ownRate);
  return r >= 1 ? r : 2.5;
}
function calc(s) {
  const ownRate = ownershipRate(s);
  const own = s.assets * (ownRate / 100);
  const interest = s.debt * (s.rate / 100);
  const living = s.cost * 12;
  const totalCost = living + interest + own;
  const passiveFromSavings = s.liq * (s.prate / 100);
  const passive = passiveFromSavings + s.taxFree + num(s.folkPay);
  const income = s.salary + passive;
  const surplus = (income - totalCost) / 12;
  const gross = s.assets + s.liq;
  const equity = gross === 0 ? 0 : ((gross - s.debt) / gross) * 100;
  const ltv = gross === 0 ? 0 : (s.debt / gross) * 100;
  const runway = totalCost === 0 ? (s.liq > 0 ? Infinity : 0) : s.liq / totalCost;
  const passiveCov = totalCost === 0 ? (passive > 0 ? Infinity : 0) : (passive / totalCost) * 100;
  const debtCov = s.debt > 0 ? (s.liq / s.debt) * 100 : Infinity;
  const coverage = totalCost === 0 ? (income > 0 ? Infinity : 0) : (income / totalCost) * 100;
  const salaryShare = income === 0 ? 0 : (s.salary / income) * 100;
  const costOfSalary = s.salary === 0 ? (totalCost > 0 ? Infinity : 0) : (totalCost / s.salary) * 100;
  const costOfIncome = income === 0 ? (totalCost > 0 ? Infinity : 0) : (totalCost / income) * 100;
  const ownShare = income === 0 ? 0 : (own / income) * 100;
  const interestShare = income === 0 ? 0 : (interest / income) * 100;
  const passiveShare = income === 0 ? 0 : (passive / income) * 100;
  return {
    own, ownRate, interest, living, totalCost, passive, passiveFromSavings, income, surplus, gross, equity, ltv,
    runway, passiveCov, debtCov, coverage, salaryShare, costOfSalary, costOfIncome,
    ownShare, interestShare, passiveShare,
  };
}
function horizon1(s, c) {
  let bal = s.liq, m = 0;
  const fixed = s.cost + (c.interest + c.own) / 12;
  while (bal > 0 && m < 1200) {
    bal += bal * (s.prate / 100) / 12 - fixed;
    m++;
  }
  return m >= 1200 ? 100 : m / 12;
}
function horizon2(c) {
  if (c.totalCost <= 0) return c.passive > 0 ? 100 : 0;
  return c.passive >= c.totalCost ? 100 : c.passive / c.totalCost;
}
function horizon3(s) {
  let bal = Math.max(0, s.assets + s.liq - s.debt), m = 0;
  while (bal > 0 && m < 1200) {
    const carry = ownershipRate(s) / 100;
    bal += bal * (s.prate / 100) / 12 - (s.cost + bal * carry / 12);
    m++;
  }
  return m >= 1200 ? 100 : m / 12;
}
function wealthLevel(s, c) {
  if (c.runway >= 8) {
    if (c.passiveCov >= 300) return s.liq >= 1e8 ? 16 : 15;
    if (c.passiveCov > 150) return 14;
    if (c.passiveCov >= 100) return 13;
    if (c.passiveCov >= 50) return 12;
    return 11;
  }
  if (c.runway >= 2) return (s.debt > 0 && c.debtCov < 100) ? 9 : 10;

function evaluate(s, c) {

  const wealth = wealthLevel(s, c);
  if (wealth > 4) return wealth;
  if (s.salary === 0 && s.taxFree > 0) return 2;
  return 4;
}
function stepLevel(prev, raw) {
  if (raw > prev) return Math.min(raw, prev + 1);
  if (raw < prev) return Math.max(raw, prev - 1);
  return raw;
}
function clamp01(x) {
  if (!Number.isFinite(x)) return x === Infinity ? 1 : 0;
  return Math.max(0, Math.min(1, x));
}
function progress(lvl, c) {
  if (lvl <= 3) return clamp01(c.coverage / 100);
  if (lvl === 9) return clamp01((c.debtCov === Infinity ? 100 : c.debtCov) / 100);
  if (lvl >= 11) {
    if (lvl >= 16) return 1;
    const floors = { 11: 0, 12: 50, 13: 100, 14: 150, 15: 300 };
    const ceils = { 11: 50, 12: 100, 13: 150, 14: 300, 15: 300 };
    const lo = floors[lvl], hi = ceils[lvl];
    if (hi === lo) return c.passiveCov >= hi ? 1 : 0;
    return clamp01((c.passiveCov - lo) / (hi - lo));
  }
  const lo = R[lvl], hi = R[lvl + 1];
  if (hi === lo) return (c.runway === Infinity || c.runway >= hi) ? 1 : 0;
  const rw = c.runway === Infinity ? 100 : c.runway;
  return clamp01((rw - lo) / (hi - lo));
}
function nextNeed(s, c, lvl) {
  if (lvl >= 16) return 0;
  if (lvl < 11) return R[lvl + 1] * c.totalCost;
  const k = [0.5, 1.0, 1.5, 3.0, 3.0][lvl - 11];
  const r = s.prate / 100;
  const still = k * c.totalCost - s.taxFree;
  if (still <= 0) return 0;
  if (r === 0) return Infinity;
  return still / r;
}
function monthlyCostForNext(s, c, lvl) {
  if (lvl >= 16) return null;
  let maxTotal;
  if (lvl <= 3) {
    const target = lvl === 3 ? 0.7 : 1;
    maxTotal = target === 0 ? 0 : c.income / target;
  } else if (lvl < 11) {
    const rn = R[lvl + 1];
    if (!(rn > 0)) return null;
    maxTotal = s.liq / rn;
  } else {
    const k = [0.5, 1.0, 1.5, 3.0, 3.0][lvl - 11];
    if (!(c.passive > 0) || !(k > 0)) return null;
    maxTotal = c.passive / k;
  }
  return (maxTotal - c.interest - c.own) / 12;
}

const G_AMOUNT = 136549;
const OTP_SALARY_CAP = 12 * G_AMOUNT;

function otpDeposit(salary, ratePct, cap) {
  const limit = cap == null ? OTP_SALARY_CAP : cap;
  const base = Math.min(Math.max(0, num(salary)), limit);
  return base * (num(ratePct) / 100);
}

function Doughnut({ living, interest, own, total, ownRate }) {
  const r = 68, C = 2 * Math.PI * r, sw = 40;
  const parts = [
    { v: Math.max(0, living), color: "var(--chart-blue)", label: "Livsopphold" },
    { v: Math.max(0, interest), color: "var(--chart-navy)", label: "Rentekostnad" },
    { v: Math.max(0, own), color: "var(--blue-400)", label: "Eierkostnad " + pct1(ownRate) },
  ];
  const sum = parts.reduce((a, p) => a + p.v, 0) || 1;
  let acc = 0;
  return (
    <div style={{ display: "flex", gap: 24, alignItems: "flex-start", flexWrap: "wrap" }}>
      <div style={{ flex: "none", width: 169 }}>
        <svg width="169" height="169" viewBox="0 0 180 180" style={{ transform: "rotate(-90deg)", display: "block" }}>
          <circle cx="90" cy="90" r={r} fill="none" stroke="var(--gray-100)" strokeWidth={sw} />
          {parts.map((p, i) => {
            const dash = (p.v / sum) * C;
            const el = (
              <circle key={i} cx="90" cy="90" r={r} fill="none" stroke={p.color} strokeWidth={sw}
                strokeDasharray={dash + " " + (C - dash)} strokeDashoffset={-acc}

            return el;

function annuityPayment(capital, rate, years) {
  if (!(capital > 0) || !(years > 0)) return 0;
  if (!(rate > 0)) return capital / years;
  return capital * rate / (1 - Math.pow(1 + rate, -years));
}
function payDownDebt(debt, ratePct, yearsLeft) {
  if (!(debt > 0) || !(yearsLeft > 0)) return 0;
  const r = ratePct / 100;
  const interest = debt * r;
  const payment = r === 0 ? debt / yearsLeft : debt * r / (1 - Math.pow(1 + r, -yearsLeft));
  const principal = Math.min(debt, Math.max(0, payment - interest));
  const next = debt - principal;
  return next < 1 ? 0 : next;
}
function projectFuture(s, a) {
  const startAge = Math.round(num(a.age));
  const endAge = Math.max(startAge, 80);
  const kpi = num(a.kpi) / 100;
  const port = num(a.portfolio) / 100;
  const passRet = num(a.passiveAssets) / 100;
  const penRet = num(a.pension) / 100;
  const pensionStart = Math.round(num(a.pensionStart));
  const payoutSpan = 15;
  let salary = s.salary, taxFree = s.taxFree, cost = s.cost, assets = s.assets, debt = s.debt, liq = s.liq;
  let pensionCapital = s.pensionCapital;
  let yearsLeft = num(a.loanYears);
  let gCap = OTP_SALARY_CAP;
  let pmt = 0;
  let paying = false;
  let folk = Math.max(0, num(a.folketrygd));
  const points = [];
  const snap = (age, deposit, payout, saved, folkPay) => {
    const state = normalize({
      salary, taxFree: taxFree + payout, cost, assets, debt, rate: s.rate, liq, prate: a.portfolio,
      pensionCapital, ownRate: a.ownRate,
    });
    state.folkPay = folkPay;
    const c = calc(state);
    const raw = evaluate(state, c);
    const lvl = points.length ? stepLevel(points[points.length - 1].lvl, raw) : raw;
    let phase = "sparing";
    if (age >= pensionStart && age < pensionStart + payoutSpan) phase = "utbetaling";
    else if (age >= pensionStart + payoutSpan) phase = "etter pensjon";
    points.push({
      age, lvl, raw, phase, deposit, payout, pensionCapital, saved, folk: folkPay,
      s: state, c, L: LEVELS[lvl],
    });
  };
  const inPayout = (age) => age >= pensionStart && age < pensionStart + payoutSpan;
  const folkNow = (age) => age >= pensionStart ? folk : 0;
  snap(startAge, startAge < pensionStart ? otpDeposit(salary, a.otp, gCap) : 0, 0, 0, folkNow(startAge));
  for (let age = startAge + 1; age <= endAge; age++) {
    const grow = 1 + kpi;
    const saved = age < pensionStart ? Math.max(0, num(a.annualSave)) : 0;
    folk *= grow;
    if (age >= pensionStart) salary = 0;
    else salary *= grow;
    cost *= grow;
    taxFree *= grow;
    liq = liq * (1 + port) + saved;
    assets *= (1 + passRet);
    gCap *= grow;
    debt = payDownDebt(debt, s.rate, yearsLeft);
    yearsLeft = Math.max(0, yearsLeft - 1);
    let deposit = 0;
    let payout = 0;
    if (inPayout(age)) {
      if (!paying) {
        const n = pensionStart + payoutSpan - age;
        pmt = annuityPayment(pensionCapital, penRet, n);
        paying = true;
      }
      payout = pmt;
      pensionCapital = Math.max(0, pensionCapital * (1 + penRet) - pmt);
    } else if (age < pensionStart) {
      deposit = otpDeposit(salary, a.otp, gCap);
      pensionCapital = pensionCapital * (1 + penRet) + deposit;
    } else {
      paying = false;
      pmt = 0;
      pensionCapital = pensionCapital * (1 + penRet);
    }
    snap(age, deposit, payout, saved, folkNow(age));
  }
  if (startAge <= 80) return points.filter(p => p.age <= 80);
  return points.slice(0, 1);
}

function shiftReason(prev, next) {
  const from = prev.lvl, to = next.lvl;
  const cov = "Passiv dekning gikk fra " + pct1(prev.c.passiveCov) + " til " + pct1(next.c.passiveCov) + ".";
  const runwayNow = yrs(next.c.runway);
  if (next.raw > to) return "Kravene til nivå " + next.raw + " er allerede oppfylt. Trappen går ett nivå av gangen, så dette året er nivå " + to + ".";
  if (next.raw < to) return "Terskelen tilsier nivå " + next.raw + ". Trappen faller ett nivå av gangen, så dette året er nivå " + to + ".";
  if (to === 16) return cov + " Oppsparte midler er " + mkr(next.s.liq) + ", over 100 mill. Det er kravet til generasjonsformue.";
  if (to === 15) return cov + " Oppsparte midler er " + mkr(next.s.liq) + ", fortsatt under 100 mill.";
  if (to === 14) return cov + " Det er over 150 %, kravet til Luksus FI.";
  if (to === 13) return cov + " Det er minst 100 %, kravet til Full FI.";
  if (to === 12) return cov + " Det er minst 50 %, og rullebanen er " + runwayNow + ", så både nivå 11 og 12 er nådd.";
  if (to === 11) return "Rullebanen gikk fra " + yrs(prev.c.runway) + " til " + runwayNow + " og passerte 8 år.";
  if (to === 10) return "Oppsparte midler (" + mkr(next.s.liq) + ") ble større enn gjelden (" + mkr(next.s.debt) + ").";
  if (to === 9) return "Rullebanen er " + runwayNow + ", og oppsparte midler dekker ikke hele gjelden.";
  if (to === 8) return "Rullebanen er " + runwayNow + ", minst ett år, og oppsparte midler er over 500 000 kr.";
  if (to === 7) return "Rullebanen passerte 6 måneder og er nå " + runwayNow + ".";
  if (to === 6) return "Rullebanen passerte 3 måneder og er nå " + runwayNow + ".";
  if (to === 5) return "Rullebanen passerte 1 måned og er nå " + runwayNow + ".";
  if (to === 3) return "Lønnen dekker under 70 % av kostnadene.";
  if (to === 2) return "Inntekten er en skattefri ytelse, uten lønn.";
  if (to < from) return "Terskelen for nivå " + from + " er ikke lenger oppfylt. " + cov + " Rullebanen er " + runwayNow + ".";
  return next.L.kriterium + ". " + cov;
}

function TabFuture({ s, a }) {
  const points = projectFuture(s, a);
  const [idx, setIdx] = useState(0);
  const [pinned, setPinned] = useState(false);
  const [hoverK, setHoverK] = useState(null);
  const i = Math.max(0, Math.min(idx, points.length - 1));
  const p = points[i];
  const startAge = points[0].age;
  const pensionStart = Math.round(num(a.pensionStart));
  const W = 800, H = 340;
  const pad = { l: 42, r: 16, t: 20, b: 34 };
  const plotW = W - pad.l - pad.r;
  const plotH = H - pad.t - pad.b;
  const n = points.length;
  const x = (k) => pad.l + (n <= 1 ? plotW / 2 : (k / (n - 1)) * plotW);
  const y = (lvl) => pad.t + (1 - lvl / 16) * plotH;
  const base = y(0);
  let line = "";
  points.forEach((pt, k) => {
    line += (k === 0 ? "M " : " H ") + x(k) + (k === 0 ? " " : " V ") + y(pt.lvl);
  });
  const area = n > 1 ? line + " L " + x(n - 1) + " " + base + " L " + x(0) + " " + base + " Z" : "";
  const ticks = [];
  points.forEach((pt) => {
    if (pt.age === startAge || pt.age === points[n - 1].age || pt.age % 5 === 0) ticks.push(pt);
  });
  const jump = (age) => {
    let best = 0;
    points.forEach((pt, k) => {
      if (Math.abs(pt.age - age) < Math.abs(points[best].age - age)) best = k;
    });
    setIdx(best);
  };
  const indexFromEvent = (e) => {
    const svg = e.currentTarget;
    const pt = svg.createSVGPoint();
    pt.x = e.clientX;
    pt.y = e.clientY;
    const ctm = svg.getScreenCTM();
    if (!ctm) return null;
    const loc = pt.matrixTransform(ctm.inverse());
    let best = 0, bestD = Infinity;
    points.forEach((_, k) => {
      const d = Math.abs(x(k) - loc.x);
      if (d < bestD) { best = k; bestD = d; }
    });
    return best;
  };
  const onChartMove = (e) => {
    const k = indexFromEvent(e);
    if (k == null) return;
    if (!pinned) setIdx(k);
    setHoverK(k > 0 && points[k].lvl !== points[k - 1].lvl ? k : null);
  };
  const zones = [
    { from: 0, to: 4, fill: "rgba(180,35,24,0.045)" },
    { from: 4, to: 10, fill: "rgba(10,94,220,0.045)" },
    { from: 10, to: 16, fill: "rgba(6,118,71,0.06)" },
  ];
  const pensionIdx = points.findIndex(pt => pt.age === pensionStart);
  const payoutEnd = pensionStart + 14;
  const bandStart = points.findIndex(pt => pt.age >= pensionStart);
  const bandEnd = points.findIndex(pt => pt.age >= Math.min(points[n - 1].age, payoutEnd));
  const bandX = (k, edge) => {
    if (k <= 0) return edge === "start" ? pad.l : x(0);
    if (k >= n - 1) return edge === "end" ? W - pad.r : x(n - 1);
    return edge === "start" ? (x(k - 1) + x(k)) / 2 : (x(k) + x(k + 1)) / 2;
  };
  const shifts = [];
  for (let k = 1; k < n; k++) {
    if (points[k].lvl !== points[k - 1].lvl) {
      shifts.push({ k: k, from: points[k - 1].lvl, to: points[k].lvl, age: points[k].age });
    }
  }
  const shiftMarks = [];
  shifts.forEach(sh => {
    const label = Math.abs(sh.to - sh.from) > 1 ? sh.from + "→" + sh.to : String(sh.to);
    const pw = Math.max(22, Math.ceil(label.length * 6.6 + 12));
    const ph = 16;
    const cx = x(sh.k);
    const cy = y(sh.to);
    const candidates = [
      { x: cx - pw / 2, y: cy - ph - 10 },
      { x: cx + 11, y: cy - ph / 2 },
      { x: cx - pw - 11, y: cy - ph / 2 },
      { x: cx - pw / 2, y: cy + 10 },
    ];
    let spot = null;
    for (let c = 0; c < candidates.length && !spot; c++) {
      const px = Math.max(pad.l + 2, Math.min(W - pad.r - pw - 2, candidates[c].x));
      const py = Math.max(2, Math.min(base - ph - 2, candidates[c].y));
      const hit = shiftMarks.some(m => px < m.x + m.w + 5 && px + pw + 5 > m.x && py < m.y + m.h + 4 && py + ph + 4 > m.y);
      if (!hit) spot = { x: px, y: py };
    }
    if (!spot) spot = { x: Math.max(pad.l + 2, Math.min(W - pad.r - pw - 2, cx + 11)), y: Math.max(2, Math.min(base - ph - 2, cy - ph / 2)) };
    const prev = points[sh.k - 1];
    const next = points[sh.k];
    shiftMarks.push({
      k: sh.k, from: sh.from, to: sh.to, age: sh.age, label: label, w: pw, h: ph, x: spot.x, y: spot.y, cx: cx, cy: cy,
      title: next.L.tittel, why: shiftReason(prev, next),
    });
  });
  const tip = shiftMarks.find(m => m.k === (hoverK != null ? hoverK : (pinned ? i : -1))) || null;
  const tipAbove = tip ? tip.cy / H > 0.34 : true;
  const tipLeft = tip ? tip.cx / W * 100 : 0;
  const tipShift = tipLeft < 20 ? "0" : tipLeft > 80 ? "-100%" : "-50%";
  const caret = tipLeft < 20 ? "18px" : tipLeft > 80 ? "calc(100% - 18px)" : "50%";
  const rows = [
    ["Brutto lønn", p.age >= pensionStart ? "0 kr" : kr(p.s.salary), p.age >= pensionStart ? "Pensjon har tatt over" : "Følger KPI frem til pensjon"],
    ["Folketrygd", kr(p.folk), p.age >= pensionStart ? "KPI-justert passiv inntekt i hele pensjonsperioden" : "Starter ved " + pensionStart + " år"],
    ["Passiv inntekt", kr(p.c.passive), (p.payout > 0 || p.folk > 0) ? "Inkluderer " + [p.payout > 0 ? kr(p.payout) + " i pensjon" : "", p.folk > 0 ? kr(p.folk) + " i folketrygd" : ""].filter(Boolean).join(" og ") : "Dekker " + pct(p.c.passiveCov) + " av kostnadene"],
    ["Pensjonsutbetaling", kr(p.payout), p.phase === "utbetaling" ? (p.payout > 0 ? "Passiv inntekt i 15 år fra " + pensionStart + " år" : "Ingen pensjonskapital å utbetale") : "Starter ved " + pensionStart + " år"],
    ["Årlige kostnader", kr(p.c.totalCost), "Livsopphold " + kr(p.c.living) + " følger KPI " + pct1(a.kpi)],
    ["Eiendeler", kr(p.s.assets), "Følger " + pct1(a.passiveAssets) + " avkastning"],
    ["Gjeld", p.s.debt === 0 ? "Gjeldfri" : kr(p.s.debt), p.s.debt === 0 ? "Nedbetalt etter planen" : "Nedbetales over " + nb(a.loanYears) + " år og faller bort"],
    ["Oppsparte midler", kr(p.s.liq), pct1(a.portfolio) + " avkastning" + (p.saved > 0 ? " pluss " + kr(p.saved) + " i sparing" : (p.age >= pensionStart && a.annualSave > 0 ? ". Årlig sparing er stoppet" : ""))],
    ["Pensjonskapital", kr(p.pensionCapital), p.phase === "utbetaling" ? "Tappes over utbetalingsperioden" : pct1(a.pension) + " avkastning"],
  ];
  return (
    <div className="future-layout">
      <div style={card({ padding: 16, minWidth: 0 })}>
        <div style={{ display: "flex", justifyContent: "space-between", gap: 16, alignItems: "flex-start", flexWrap: "wrap" }}>
          <div style={{ maxWidth: 560 }}>
            <div style={{ fontSize: 16, fontWeight: 500, letterSpacing: "-.01em" }}>Fremtidige nivåer</div>
            <div style={{ fontSize: 12, color: "var(--gray-500)", marginTop: 4, lineHeight: 1.45 }}>
              Fra {startAge} år til 80 år. Eiendeler følger avkastningen på passive eiendeler. Gjelden nedbetales etter planen og faller bort. Årlige kostnader KPI-justeres. Lønn faller bort ved pensjonsalder, og pensjon tar over som passiv inntekt i 15 år.
            </div>
          </div>
          <div style={{ textAlign: "right" }}>
            <div style={Object.assign({ fontSize: 32, lineHeight: 1 }, numStyle)}>Nivå {p.lvl}</div>
            <div style={{ fontSize: 13, color: "var(--gray-600)", marginTop: 2 }}>{p.L.tittel} · {p.age} år</div>
          </div>
        </div>
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", margin: "12px 0 8px" }}>
          <Btn primary={i === 0} onClick={() => jump(startAge)}>I dag ({startAge} år)</Btn>
          {pensionStart >= startAge && pensionStart <= 80 && (
            <Btn primary={p.age === pensionStart} onClick={() => jump(pensionStart)}>Pensjon ({pensionStart} år)</Btn>
          )}
          <Btn primary={i === n - 1} onClick={() => jump(80)}>80 år</Btn>
          {pinned && <Btn onClick={() => setPinned(false)}>Løsne</Btn>}
        </div>
        <div style={{ width: "95%", margin: "0 auto", position: "relative" }}>
        <svg
          className="future-chart"
          viewBox={"0 0 " + W + " " + H}
          width="100%"
          role="img"
          aria-label={"Nivå fra alder " + startAge + " til 80"}
          tabIndex={0}
          style={{ display: "block", cursor: "crosshair", touchAction: "none" }}
          onMouseMove={onChartMove}
          onMouseLeave={() => setHoverK(null)}
          onClick={(e) => { const k = indexFromEvent(e); if (k != null) { setIdx(k); setPinned(true); } }}
          onKeyDown={(e) => {
            if (e.key === "ArrowRight") { setIdx(Math.min(n - 1, i + 1)); e.preventDefault(); }
            if (e.key === "ArrowLeft") { setIdx(Math.max(0, i - 1)); e.preventDefault(); }
          }}
        >
          <defs>
            <linearGradient id="lvlFill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor="#0A5EDC" stopOpacity="0.28" />
              <stop offset="100%" stopColor="#0A5EDC" stopOpacity="0.02" />
            </linearGradient>
            <filter id="lvlPill" x="-30%" y="-40%" width="160%" height="180%">
              <feDropShadow dx="0" dy="1" stdDeviation="1.1" floodColor="#002359" floodOpacity="0.16" />
            </filter>
          </defs>
          {zones.map(z => (
            <rect key={z.from} x={pad.l} y={y(z.to)} width={plotW} height={y(z.from) - y(z.to)} fill={z.fill} />
          ))}
          {[0, 4, 8, 12, 16].map(lvl => (
            <g key={lvl}>
              <line x1={pad.l} x2={W - pad.r} y1={y(lvl)} y2={y(lvl)} stroke="var(--gray-200)" strokeWidth="1" />
              <text x={pad.l - 8} y={y(lvl) + 4} textAnchor="end" fontSize="11" fill="var(--gray-500)">{lvl}</text>
            </g>
          ))}
          {pensionIdx >= 0 && bandStart >= 0 && bandEnd >= bandStart && (
            <rect
              x={bandX(bandStart, "start")}
              y={pad.t}
              width={Math.max(0, bandX(bandEnd, "end") - bandX(bandStart, "start"))}
              height={plotH}
              fill="rgba(181,71,8,0.08)"
            />
          )}
          {pensionIdx >= 0 && (
            <g>
              <line x1={x(pensionIdx)} x2={x(pensionIdx)} y1={pad.t} y2={base} stroke="var(--warning-700)" strokeDasharray="4 4" strokeWidth="1.25" />
              <text x={x(pensionIdx)} y={pad.t - 6} textAnchor="middle" fontSize="11" fill="var(--warning-700)">Pensjon</text>
            </g>
          )}
          {area && <path d={area} fill="url(#lvlFill)" />}
          {n > 1 && <path d={line} fill="none" stroke="var(--blue-main)" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />}
          {shiftMarks.map(m => (
            <g key={"shift-" + m.age}>
              <line x1={m.cx} x2={m.cx} y1={y(m.from)} y2={m.cy} stroke="#fff" strokeWidth="6" strokeLinecap="round" />
              <line x1={m.cx} x2={m.cx} y1={y(m.from)} y2={m.cy} stroke="var(--sp-navy)" strokeWidth="2.4" strokeLinecap="round" />
              <circle cx={m.cx} cy={m.cy} r="7" fill="#fff" />
              <circle cx={m.cx} cy={m.cy} r="4.5" fill="var(--blue-main)" stroke="#fff" strokeWidth="1.5" />
              <rect x={m.x} y={m.y} width={m.w} height={m.h} rx="8" fill="#fff" stroke="var(--blue-main)" strokeWidth="1" filter="url(#lvlPill)" />
              <text x={m.x + m.w / 2} y={m.y + 11.5} textAnchor="middle" fontSize="10" fontWeight="600" fill="var(--sp-navy)" fontFamily="Hanken Grotesk, system-ui, sans-serif">{m.label}</text>
              <title>{"Nivå " + m.from + " til " + m.to + " ved " + m.age + " år"}</title>
            </g>
          ))}
          <line x1={x(i)} x2={x(i)} y1={pad.t} y2={base} stroke="var(--sp-navy)" strokeOpacity="0.35" strokeWidth="1" />
          <circle cx={x(i)} cy={y(p.lvl)} r="6" fill="#fff" stroke="var(--blue-main)" strokeWidth="2.5" />
          {ticks.map(pt => {
            const k = points.indexOf(pt);
            return (
              <text key={pt.age} x={x(k)} y={H - 10} textAnchor="middle" fontSize="11" fill={pt.age === p.age ? "var(--sp-navy)" : "var(--gray-500)"} fontWeight={pt.age === p.age ? 600 : 400}>{pt.age}</text>
            );
          })}
        </svg>
        {tip && (
          <div className={"shift-tip" + (tipAbove ? "" : " below")} style={{
            left: tipLeft + "%",
            top: (tipAbove ? tip.cy / H * 100 : y(tip.from) / H * 100) + "%",
            transform: "translate(" + tipShift + ", " + (tipAbove ? "calc(-100% - 14px)" : "14px") + ")",
            "--caret": caret,
          }}>
            <div style={{ fontSize: 11, fontWeight: 600, letterSpacing: ".04em", textTransform: "uppercase", color: "var(--blue-main)" }}>{tip.age} år</div>
            <div style={{ fontSize: 13, fontWeight: 600, marginTop: 2 }}>Nivå {tip.from} → {tip.to} · {tip.title}</div>
            <div style={{ fontSize: 12, lineHeight: 1.4, color: "var(--gray-600)", marginTop: 4 }}>{tip.why}</div>
          </div>
        )}
        <input
          type="range"
          min={0}
          max={Math.max(0, n - 1)}
          step={1}
          value={i}
          onChange={e => { setIdx(Number(e.target.value)); setPinned(true); }}
          aria-label="Velg alder"
          style={{ marginTop: 4 }}
        />
        </div>
      </div>
      <div style={card({ padding: 16 })}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 8 }}>
          <Eyebrow>{p.age === startAge ? "I dag" : p.phase === "utbetaling" ? "Pensjon utbetales" : p.phase === "etter pensjon" ? "Etter utbetaling" : "Fremtidig år"}</Eyebrow>
          <span style={{ fontSize: 12, color: "var(--gray-500)" }}>{pinned ? "Festet" : "Følger pekeren"}</span>
        </div>
        <div style={{ fontSize: 20, fontWeight: 500, margin: "6px 0 2px" }}>{p.L.tittel}</div>
        <div style={{ fontSize: 12, color: "var(--gray-500)", lineHeight: 1.4, minHeight: 34 }}>{p.L.kriterium}</div>
        <div style={{ marginTop: 8 }}>
          {rows.map(([label, value, sub]) => (
            <div key={label} style={{ padding: "8px 0", borderTop: "1px solid var(--gray-100)" }}>
              <div style={{ display: "flex", justifyContent: "space-between", gap: 8 }}>
                <span style={{ fontSize: 12, color: "var(--gray-500)" }}>{label}</span>
                <span style={Object.assign({ fontSize: 13 }, numStyle)}>{value}</span>
              </div>
              <div style={{ fontSize: 11, color: "var(--gray-400)", marginTop: 2 }}>{sub}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

        </div>
        <div style={card({ padding: 14 })}>
          <div style={{ fontSize: 15, fontWeight: 500, letterSpacing: "-.01em", marginBottom: 4 }}>Inntekt mot totale årlige kostnader</div>

          <Metric label="Gjeldsgrad av brutto eiendeler" value={s.debt === 0 ? "Gjeldfri" : pct(c.ltv)} sub={kr(s.debt) + " i gjeld"} />

            sub={c.salaryShare > 80 ? "Høy avhengighet av lønn" : "Lønnens andel av inntektene"} />
          <Metric label="Passiv inntekt i % av totale inntekter" value={pct(c.passiveShare)} sub="Avkastning og skattefrie inntekter" />
          <Metric label="Kostnader i % av lønnsinntekt" value={s.salary === 0 ? "Ingen lønn" : pct(c.costOfSalary)}
            color={!Number.isFinite(c.costOfSalary) ? undefined : (c.costOfSalary > 100 ? "var(--error-700)" : "var(--success-700)")}
            sub="Under 100 % betyr at lønnen bærer kostnadene" />
          <Metric label="Kostnader i % av totale inntekter" value={pct(c.costOfIncome)} sub="Samlet dekning inkludert passiv inntekt" />
          <Metric label="Eierkostnad i % av totale inntekter" value={pct(c.ownShare)}
            color={c.ownShare > 25 ? "var(--warning-700)" : undefined}

          <Metric label="Rentekostnad i % av totale inntekter" value={pct(c.interestShare)}

            sub={s.debt === 0 ? "Ingen gjeld" : "Faktisk rente på total gjeld"} />
          <Metric label="Passiv dekningsgrad av kostnader" value={pct(c.passiveCov)} sub="100 % betyr full økonomisk frihet" />
        </div>
      </div>
    </div>
  );
}

function TabMatrix({ s, c, lvl, loadLevel }) {
  const [hover, setHover] = useState(null);
  const h1 = horizon1(s, c), h2 = horizon2(c), h3 = horizon3(s);
  const cards = [
    { n: 1, t: "Kun oppsparte midler", v: h1,
      exp: "Lønn bortfaller, og du lever av oppsparte midler. Passiv inntekt faller gradvis bort etter hvert som midlene tappes ned.",
      pre: "Bolig, hytte og gjeld beholdes — eierkostnad " + kr(c.own) + " og renter " + kr(c.interest) + " løper videre." },
    { n: 2, t: "Kun passive inntekter", v: h2,
      exp: h2 >= 100
        ? "Passiv inntekt dekker alle faste kostnader og livsopphold uten å tære på kapitalen."
        : "Passiv inntekt alene betaler " + pct(c.passiveCov) + " av et års kostnader — resten må dekkes av lønn eller kapital.",
      pre: "Kapitalen røres ikke så lenge avkastningen bærer kostnadene." },
    { n: 3, t: "Alle eiendeler selges", v: h3,
      exp: "Du slutter å jobbe og lever av egenkapitalen: eiendelene selges, gjelden innløses, og du bruker pengene til det er tomt.",
      pre: "Netto egenkapital " + kr(Math.max(0, s.assets + s.liq - s.debt)) + ". Eierkostnad og passiv inntekt faller i takt med kapitalen." },
  ];
  const th = { fontSize: 11, fontWeight: 600, color: "var(--gray-500)", textAlign: "right", padding: "6px 10px", whiteSpace: "nowrap" };
  const td = { fontSize: 12, padding: "5px 10px", borderTop: "1px solid var(--gray-100)", fontVariantNumeric: "tabular-nums", whiteSpace: "nowrap" };
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 10, minHeight: 0, flex: 1 }}>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, minmax(0, 1fr))", gap: 10, flex: "none" }}>
        {cards.map(x => (
          <div key={x.n} style={card({ padding: 14 })}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
              <span style={{ width: 22, height: 22, borderRadius: "50%", background: "var(--blue-100)", color: "var(--blue-main)", display: "inline-flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 600 }}>{x.n}</span>
              <div style={{ fontSize: 14, fontWeight: 500 }}>{x.t}</div>
            </div>
            <div style={Object.assign({ fontSize: 28, lineHeight: 1.1, margin: "4px 0 6px" }, numStyle)}>{yrs(x.v)}</div>
            <p style={{ fontSize: 12, lineHeight: 1.4, color: "var(--gray-600)", margin: "0 0 8px" }}>{x.exp}</p>
            <div style={{ borderTop: "1px solid var(--gray-200)", paddingTop: 8, fontSize: 12, color: "var(--gray-500)", lineHeight: 1.35 }}>{x.pre}</div>
          </div>
        ))}
      </div>
      <div style={card({ padding: 0, overflow: "hidden", flex: 1, minHeight: 0, display: "flex", flexDirection: "column" })}>
        <div style={{ overflow: "auto", flex: 1 }}>
          <table style={{ width: "100%", minWidth: 1000, borderCollapse: "collapse" }}>
            <thead>
              <tr>
                <th style={Object.assign({}, th, { textAlign: "left" })}>Nivå</th>
                <th style={Object.assign({}, th, { textAlign: "left" })}>Kriterium</th>
                <th style={th}>1</th>
                <th style={th}>Oppsparte midler</th>
                <th style={th}>2</th>
                <th style={th}>Kun passiv inntekt</th>
                <th style={th}>3</th>
                <th style={th}>Alle eiendeler</th>
                <th style={th}>Gjeldsgrad</th>
                <th style={th}>Passiv dekning</th>
              </tr>
            </thead>
            <tbody>
              {LEVELS.map(L => {
                const ns = normalize(L.p);
                const nc = calc(ns);
                const active = lvl === L.n;
                const hot = hover === L.n;
                const bg = active ? "var(--blue-50)" : hot ? "var(--gray-50)" : "#fff";
                return (
                  <tr key={L.n}
                    onClick={() => loadLevel(L.n)}
                    onMouseEnter={() => setHover(L.n)}
                    onMouseLeave={() => setHover(null)}
                    style={{ background: bg, cursor: "pointer" }}>
                    <td style={Object.assign({}, td, { fontWeight: active ? 600 : 500, color: active ? "var(--blue-main)" : "var(--sp-navy)", textAlign: "left" })}>
                      {L.n} · {L.tittel}
                    </td>
                    <td style={Object.assign({}, td, { textAlign: "left", color: "var(--gray-600)", whiteSpace: "normal" })}>{L.kriterium}</td>
                    <td style={Object.assign({}, td, { textAlign: "right" })}>{yrs(horizon1(ns, nc))}</td>
                    <td style={Object.assign({}, td, { textAlign: "right" })}>{kr(ns.liq)}</td>
                    <td style={Object.assign({}, td, { textAlign: "right" })}>{yrs(horizon2(nc))}</td>
                    <td style={Object.assign({}, td, { textAlign: "right" })}>{kr(nc.passive)}</td>
                    <td style={Object.assign({}, td, { textAlign: "right" })}>{yrs(horizon3(ns))}</td>
                    <td style={Object.assign({}, td, { textAlign: "right" })}>{kr(nc.gross)}</td>
                    <td style={Object.assign({}, td, { textAlign: "right" })}>{ns.debt === 0 ? "Gjeldfri" : pct(nc.ltv)}</td>
                    <td style={Object.assign({}, td, { textAlign: "right" })}>{pct(nc.passiveCov)}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

function toneStyle(kind) {
  if (kind === "error") return { bg: "var(--error-bg)", fg: "var(--error-700)" };
  if (kind === "warn") return { bg: "var(--warning-bg)", fg: "var(--warning-700)" };
  if (kind === "ok") return { bg: "var(--success-bg)", fg: "var(--success-700)" };
  return { bg: "var(--blue-50)", fg: "var(--blue-main)" };
}

function RecCard({ icon, title, kicker, pill, kind, points, footLabel, footValue }) {
  const t = toneStyle(kind);
  return (
    <div style={card({ padding: 14, display: "flex", flexDirection: "column", minHeight: 0 })}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10 }}>
        <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
          <div style={{ width: 32, height: 32, borderRadius: 8, background: "var(--blue-50)", display: "flex", alignItems: "center", justifyContent: "center", flex: "none" }}>
            <Ico name={icon} size={16} color="var(--blue-main)" />
          </div>
          <div>
            <div style={{ fontSize: 14, fontWeight: 500 }}>{title}</div>
            <div style={{ fontSize: 11, color: "var(--gray-500)" }}>{kicker}</div>
          </div>
        </div>
        <span style={{ background: t.bg, color: t.fg, fontSize: 11, fontWeight: 500, padding: "3px 8px", borderRadius: 100, whiteSpace: "nowrap" }}>{pill}</span>
      </div>
      <ul style={{ listStyle: "none", padding: 0, margin: "10px 0 0", flex: 1 }}>
        {points.map((p, i) => (
          <li key={i} style={{ display: "flex", gap: 6, fontSize: 12, lineHeight: 1.4, color: "var(--sp-navy)", marginBottom: 6 }}>
            <Ico name="right-arrow-alt" size={14} color="var(--blue-main)" style={{ marginTop: 2, flex: "none" }} />
            <span>{p}</span>
          </li>
        ))}
      </ul>
      <div style={{ borderTop: "1px solid var(--gray-200)", paddingTop: 8, display: "flex", justifyContent: "space-between", gap: 8, marginTop: 6 }}>
        <span style={{ fontSize: 13, color: "var(--gray-500)" }}>{footLabel}</span>
        <span style={Object.assign({ fontSize: 14 }, numStyle)}>{footValue}</span>
      </div>
    </div>
  );
}

function TabStatus({ s, c, lvl, L, prog }) {
  const next = LEVELS[Math.min(16, lvl + 1)];
  const need = nextNeed(s, c, lvl);
  const gap = lvl >= 16 ? 0 : (Number.isFinite(need) ? need - s.liq : Infinity);
  const fulfilled = lvl >= 16 || (Number.isFinite(gap) && gap <= 0);
  const costKind = c.costOfIncome > 100 ? "error" : c.costOfIncome > 80 ? "warn" : "ok";
  const costPill = c.costOfIncome > 100 ? "Kritisk" : c.costOfIncome > 80 ? "Prioritet" : "Under kontroll";
  const ltvKind = s.debt === 0 ? "ok" : c.ltv > 70 ? "error" : c.ltv > 40 ? "warn" : "ok";
  const ltvPill = s.debt === 0 ? "Gjeldfri" : c.ltv > 70 ? "Høy" : c.ltv > 40 ? "Moderat" : "Lav";
  const livShare = c.totalCost > 0 ? (c.living / c.totalCost) * 100 : 0;
  const freed = c.living * 0.1;
  const mNext = monthlyCostForNext(s, c, lvl);
  const yearsToClose = c.surplus > 0 && gap > 0 ? gap / (c.surplus * 12) : null;
  const rate = s.prate / 100;
  const stillForFi = Math.max(0, c.totalCost - s.taxFree);
  const fiNeed = stillForFi === 0 ? 0 : (rate > 0 ? stillForFi / rate : Infinity);
  const plus1rate = s.debt * 0.01;

  const costPoints = [
    "Livsopphold utgjør " + pct(livShare) + " av totale kostnader. Et kutt på 10 % frigjør " + kr(freed) + " per år (" + kr(freed / 12) + " per måned).",
    (mNext == null || !Number.isFinite(mNext))
      ? "Neste nivå styres av kapital og avkastning mer enn av kostnadsnivået alene."
      : mNext <= 0
        ? "Eierkostnad og renter alene overstiger det kostnadsnivået som ville oppfylt neste nivå med dagens oppsparte midler."
        : "Med dagens oppsparte midler ville et månedlig kostnadsnivå på " + kr(mNext) + " alene oppfylt kravet til neste nivå.",
    "Eierkostnaden på " + kr(c.own) + " per år følger eiendelene, ikke inntekten. Den løper uavhengig av lønn.",
  ];
  const debtPoints = s.debt === 0 ? [
    "Ingen gjeld. Renteøkninger treffer ikke husholdningen.",
    "Belåningsgraden er 0 %. Kapitalen er ubelånt.",
    "Gjeldfrihet er allerede oppnådd — kravet til nivå 10 er innfridd på dette punktet.",
  ] : [
    "Gjelden er " + kr(s.debt) + ", tilsvarende " + pct(c.ltv) + " av brutto eiendeler. Rentekostnaden er " + kr(c.interest) + " per år.",
    "Ett prosentpoeng høyere rente koster " + kr(plus1rate) + " mer per år (" + kr(plus1rate / 12) + " per måned).",
    "Oppsparte midler dekker " + (c.debtCov === Infinity ? "all gjeld" : pct(c.debtCov) + " av gjelden") + ". 100 % er kravet til nivå 10.",
  ];
  const savPoints = [
    lvl >= 16
      ? "Kravet til toppen av stigen er innfridd. Videre arbeid handler om forvaltning og formål."
      : "Neste nivå krever " + (Number.isFinite(need) ? kr(need) : "–") + " i oppsparte midler. Gapet er " + (fulfilled ? "lukket" : (Number.isFinite(gap) ? kr(Math.max(0, gap)) : "–")) + ".",
    c.surplus <= 0 && !fulfilled
      ? "Månedlig overskudd er negativt. Gapet lukkes ikke uten inntektsøkning eller kutt i kostnadene."
      : fulfilled
        ? "Kapitalkravet til neste nivå er oppfylt — øvrige kriterier kan fortsatt gjenstå."
        : "Med dagens månedlige overskudd på " + kr(c.surplus) + " lukkes gapet på " + yrs(yearsToClose) + ".",
    "Dagens midler gir " + yrs(horizon1(s, c)) + " uten lønn (horisont 1). Selges alt, er horisonten " + yrs(horizon3(s)) + " (horisont 3).",
  ];
  const incPoints = [
    "Passiv inntekt er " + kr(c.passive) + " per år"
      + (s.taxFree > 0
        ? " (" + kr(c.passiveFromSavings) + " fra oppsparte midler ved " + pct1(s.prate) + " og " + kr(s.taxFree) + " i skattefrie inntekter)"
        : " ved " + pct1(s.prate) + " avkastning")
      + " og dekker " + pct(c.passiveCov) + " av kostnadene.",
    "Full frihet (100 % dekning) krever " + (Number.isFinite(fiNeed) ? kr(fiNeed) : "positiv avkastning") + " i oppsparte midler ved dagens avkastning.",
    "Lønn utgjør " + pct(c.salaryShare) + " av totale inntekter." + (c.salaryShare > 80 ? " Avhengigheten av lønn er høy." : ""),
  ];

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 10, minHeight: 0, flex: 1 }}>
      <div style={card({ padding: 16, display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(min(100%, 320px), 1fr))", gap: 20, flex: "none" })}>
        <div>
          <Eyebrow color="var(--blue-main)">Beregnet status</Eyebrow>
          <h2 style={{ fontSize: 18, fontWeight: 500, letterSpacing: "-.01em", margin: "6px 0 8px", lineHeight: 1.3 }}>
            {lvl >= 16
              ? "Nivå 16 i dag. Toppen av stigen."
              : "Nivå " + lvl + " i dag. Neste steg er nivå " + next.n + " — " + next.tittel + "."}
          </h2>
          <p style={{ fontSize: 13, lineHeight: 1.45, color: "var(--sp-navy)", margin: 0, textWrap: "pretty" }}>
            Brutto lønnsinntekt er {s.salary === 0 ? "ingen" : kr(s.salary)}. Totale årlige kostnader er {kr(c.totalCost)}. Oppsparte midler er {kr(s.liq)}. Fremdrift mot neste nivå er {pct(prog * 100)}.
          </p>
        </div>
        <div>
          <div style={{ fontSize: 13, fontWeight: 500, marginBottom: 4 }}>
            {lvl >= 16 ? "Kravet for nivå 16 · Generasjonsformue" : "Kravet for nivå " + next.n + " · " + next.tittel}
          </div>
          <div style={{ fontSize: 13, color: "var(--gray-600)", marginBottom: 8 }}>{lvl >= 16 ? L.kriterium : next.kriterium}</div>
          {[
            ["Oppsparte midler i dag", kr(s.liq)],
            ["Behov for neste nivå", lvl >= 16 ? "Oppnådd" : (Number.isFinite(need) ? kr(need) : "–")],
            ["Gap", fulfilled ? "Kravet oppfylt" : (Number.isFinite(gap) ? kr(Math.max(0, gap)) : "–")],
          ].map(([a, b], i) => (
            <div key={a} style={{ display: "flex", justifyContent: "space-between", gap: 12, padding: "5px 0", borderTop: "1px solid var(--gray-100)" }}>
              <span style={{ fontSize: 12, color: "var(--gray-500)" }}>{a}</span>
              <span style={Object.assign({ fontSize: 13, color: i === 2 ? (fulfilled ? "var(--success-700)" : "var(--warning-700)") : "var(--sp-navy)" }, numStyle)}>{b}</span>
            </div>
          ))}
        </div>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(4, minmax(0, 1fr))", gap: 10, flex: 1, minHeight: 0 }}>
        <RecCard icon="receipt" title="Kostnader" kicker="Størst umiddelbar effekt" pill={costPill} kind={costKind}
          points={costPoints} footLabel="Kostnader i % av totale inntekter" footValue={pct(c.costOfIncome)} />
        <RecCard icon="building-house" title="Gjeld og rente" kicker="Reduserer sårbarhet" pill={ltvPill} kind={ltvKind}
          points={debtPoints} footLabel="Gjeldsgrad" footValue={s.debt === 0 ? "Gjeldfri" : pct(c.ltv)} />
        <RecCard icon="line-chart" title="Oppsparte midler" kicker="Bygger rullebane og frihet"
          pill={fulfilled ? "Kravet oppfylt" : ("Gap " + (Number.isFinite(gap) ? mkr(Math.max(0, gap)) + " kr" : "–"))}
          kind={fulfilled ? "ok" : "warn"}
          points={savPoints} footLabel="Rullebane oppsparte midler" footValue={yrs(horizon1(s, c))} />
        <RecCard icon="trending-up" title="Inntekt og avkastning" kicker="Flytter dekningsgraden"
          pill={c.passiveCov >= 100 ? "FI oppnådd" : (pct(c.passiveCov) + " dekket")}
          kind={c.passiveCov >= 100 ? "ok" : "info"}
          points={incPoints} footLabel="Passiv dekningsgrad" footValue={pct(c.passiveCov)} />
      </div>
    </div>
  );
}

  { n:2, tittel:"Offentlig støtte", terskel:"Ytelser er eneste husholdningsinntekt", usa:7.25, europa:8.1, norden:7.0, norge:6.6, kort:"ytelser" },

const RKEYS = ["usa","europa","norden","norge"];
const RMETA = {
  usa: { name:"USA", color:"#9747FF" },
  europa: { name:"Europa", color:"#98A2B3" },
  norden: { name:"Norden", color:"#264472" },
  norge: { name:"Norge", color:"#0A5EDC" },
};
const MEDIAN_LV = { usa:5, europa:6, norden:6, norge:6 };
const DIST_NOTES = {
  0: "Kalibrert som bostedsløshet, ikke «fattigdom»: 4 197 voksne i Norge (uke 48 2025) = 0,075 %, mot 745 652 i USA (HUD jan. 2025) = 0,22 %. Punkttelling undervurderer; årsprevalens er 3–5× høyere. Behandle nivå 0 som et gulv.",
  2: "Sosialhjelp er behovsprøvd og subsidiær — å motta stønad forutsetter tilnærmet null likviditet, og plasserer mottakeren presist på nivå 2 med null rullebane.",

};
const DIST_NOTE_FB = "Modellestimat interpolert mellom ankerpunktene. Bruk fordelingsformen, ikke desimalene.";
const meanLevel = col => {
  const s = col.reduce((a, p) => a + p, 0);
  return s === 0 ? 0 : col.reduce((a, p, i) => a + p * i, 0) / s;
};
const colOf = k => DIST.map(d => d[k]);
const MEANS = { usa: meanLevel(colOf("usa")), europa: meanLevel(colOf("europa")), norden: meanLevel(colOf("norden")), norge: meanLevel(colOf("norge")) };
const fmtPct1 = n => {
  if (!Number.isFinite(n)) return "–";
  const d = Math.abs(n) < 1 ? 2 : 1;
  return n.toFixed(d).replace(".", ",") + "\u00a0%";
};
const fmtN = n => Number.isFinite(n) ? n.toFixed(2).replace(".", ",") : "–";
const catmullPath = pts => {
  if (!pts.length) return "";
  let d = "M " + pts[0][0].toFixed(2) + "," + pts[0][1].toFixed(2);
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    d += " C " + (p1[0] + (p2[0] - p0[0]) / 6).toFixed(2) + "," + (p1[1] + (p2[1] - p0[1]) / 6).toFixed(2) + " "
      + (p2[0] - (p3[0] - p1[0]) / 6).toFixed(2) + "," + (p2[1] - (p3[1] - p1[1]) / 6).toFixed(2) + " "
      + p2[0].toFixed(2) + "," + p2[1].toFixed(2);
  }
  return d;
};
const VW = 1160, VH = 468;
const PAD_L = 56, PAD_R = 20, PAD_T = 78, PAD_B = 22;
const PLOT_R = VW - PAD_R, PLOT_B = VH - PAD_B, PLOT_H = PLOT_B - PAD_T;
const xOf = i => PAD_L + i * (PLOT_R - PAD_L) / 16;
const yOf = (v, mx) => PLOT_B - (v / mx) * PLOT_H;
const seriesOf = (key, mode) => {
  const col = colOf(key);
  if (mode !== "kumulativ") return col;
  let s = 0;
  return col.map(v => (s += v));
};

function NdChip({ on, children, onClick, label }) {
  const [h, setH] = useState(false);
  return (
    <button type="button" className="nd-chip" aria-pressed={on} aria-label={label || undefined} onClick={onClick}
      onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
      style={{ height: 34, borderRadius: 8, padding: "0 12px", display: "inline-flex", alignItems: "center", gap: 8, cursor: "pointer",
        fontFamily: "inherit", fontSize: 13, fontWeight: 500,
        background: on ? "var(--blue-100)" : (h ? "var(--gray-50)" : "#fff"),
        color: on ? "var(--sp-navy)" : "var(--gray-500)",
        border: "1px solid " + (on ? "var(--blue-300)" : "var(--gray-300)"),
        transition: "background .15s ease-out, border-color .15s ease-out" }}>
      {children}
    </button>
  );
}

function DistributionChart({ visible, mode, hover, selected, setHover, setSelected, accent, clientLvl, showClient }) {
  const mx = mode === "kumulativ" ? 100 : 20;
  const active = hover != null ? hover : selected;
  const vis = RKEYS.filter(k => visible[k]);
  const showLines = mode !== "kumulativ";
  const pts = k => seriesOf(k, mode).map((v, i) => [xOf(i), yOf(v, mx)]);
  const zone = (a, b) => {
    const x1 = Math.max(PAD_L, xOf(a) - 33.9), x2 = Math.min(PLOT_R, xOf(b) + 33.9);
    return { x: x1, w: x2 - x1 };
  };
  const z0 = zone(0, 4), z1 = zone(5, 9), z2 = zone(10, 16);
  const yTicks = [0, mx * 0.25, mx * 0.5, mx * 0.75, mx];
  const medianGroups = [];
  vis.forEach(k => {
    const lv = MEDIAN_LV[k];
    let g = medianGroups.find(x => x.lv === lv);
    if (!g) { g = { lv, keys: [] }; medianGroups.push(g); }
    g.keys.push(k);
  });
  const onKey = e => {
    if (e.key === "ArrowLeft") { e.preventDefault(); setSelected(Math.max(0, selected - 1)); setHover(null); }
    if (e.key === "ArrowRight") { e.preventDefault(); setSelected(Math.min(16, selected + 1)); setHover(null); }
    if (e.key === "Enter") { e.preventDefault(); setSelected(active); setHover(null); }
  };
  const tipLeft = hover == null ? 0 : xOf(hover) / VW * 100;
  const tipFlip = tipLeft > 62;
  const labelTop = PAD_T / VH * 100;
  return (
    <div style={{ width: "90%", margin: "0 auto" }}>
      <div style={{ position: "relative", overflow: "hidden" }} tabIndex={0} onKeyDown={onKey} aria-label="Fordelingskurve etter nivå. Bruk piltaster for å flytte valgt nivå, Enter for å låse.">
        <svg viewBox={"0 0 " + VW + " " + VH} role="img"
          aria-label={"Fordeling av husholdninger på 17 nivåer for " + vis.map(k => RMETA[k].name).join(", ")}
          style={{ width: "100%", aspectRatio: VW + "/" + VH, height: "auto", display: "block" }}>
          <defs>
            <clipPath id="nd-plot-clip">
              <rect x={PAD_L} y={PAD_T} width={PLOT_R - PAD_L} height={PLOT_H} />
            </clipPath>
          </defs>
          <rect x={z0.x} y={PAD_T} width={z0.w} height={PLOT_H} fill="rgba(253,162,155,.10)" />
          <rect x={z1.x} y={PAD_T} width={z1.w} height={PLOT_H} fill="rgba(10,94,220,.04)" />
          <rect x={z2.x} y={PAD_T} width={z2.w} height={PLOT_H} fill="rgba(38,68,114,.06)" />
          {showClient && clientLvl != null && (() => {
            const x = xOf(clientLvl) - 33.9;
            const x1 = Math.max(PAD_L, x);
            const w = Math.min(PLOT_R, x + 67.8) - x1;
            const cx = xOf(clientLvl);
            return (
              <g pointerEvents="none">
                <rect x={x1} y={PAD_T} width={w} height={PLOT_H} fill="rgba(0,35,89,.10)" />
                <line x1={cx} x2={cx} y1={PAD_T} y2={PLOT_B} stroke="var(--sp-navy)" strokeWidth="1.75" />
                <polygon points={[cx, PAD_T + 2, cx + 6, PAD_T + 10, cx, PAD_T + 18, cx - 6, PAD_T + 10].join(" ")} fill="var(--sp-navy)" />
              </g>
            );
          })()}
          {active != null && !(showClient && active === clientLvl) && (() => {
            const x = xOf(active) - 33.9;
            const x1 = Math.max(PAD_L, x);
            const w = Math.min(PLOT_R, x + 67.8) - x1;
            return <rect x={x1} y={PAD_T} width={w} height={PLOT_H} fill="var(--blue-100)" stroke="var(--blue-300)" strokeWidth="1.5" pointerEvents="none" />;
          })()}
          {yTicks.map(v => {
            const y = yOf(v, mx);
            return <line key={v} x1={PAD_L} x2={PLOT_R} y1={y} y2={y} stroke={v === 0 ? "var(--gray-300)" : "var(--chart-grid)"} strokeWidth="1" />;
          })}
          {showLines && medianGroups.map(g => (
            <line key={"med"+g.lv} x1={xOf(g.lv)} x2={xOf(g.lv)} y1={PAD_T} y2={PLOT_B}

          {showLines && vis.map(k => (
            <line key={"mean"+k} x1={xOf(MEANS[k])} x2={xOf(MEANS[k])} y1={PAD_T} y2={PLOT_B}
              stroke={RMETA[k].color} strokeWidth="2" strokeDasharray="1.5 4" strokeLinecap="round" opacity="0.9" />
          ))}
          <g clipPath="url(#nd-plot-clip)">
            {vis.map(k => {
              const p = pts(k), d = catmullPath(p), acc = k === accent;
              return (
                <g key={k}>
                  {acc && <path d={d + " L " + xOf(16) + " " + PLOT_B + " L " + PAD_L + " " + PLOT_B + " Z"} fill="rgba(10,94,220,.07)" />}
                  <path d={d} fill="none" stroke={RMETA[k].color} strokeWidth={acc ? 3.4 : 2} strokeLinejoin="round" strokeLinecap="round" />
                </g>
              );
            })}
          </g>
          {active != null && vis.map(k => {
            const v = seriesOf(k, mode)[active];
            return <circle key={"m"+k} cx={xOf(active)} cy={yOf(v, mx)} r="4.5" fill="#fff" stroke={RMETA[k].color} strokeWidth="2.5" />;
          })}
          {showClient && clientLvl != null && vis.map(k => {

            return <circle key={"c"+k} cx={xOf(clientLvl)} cy={yOf(v, mx)} r="5.5" fill="#fff" stroke="var(--sp-navy)" strokeWidth="2.2" />;
          })}
          {DIST.map(d => (
            <rect key={d.n} x={xOf(d.n) - 33.9} y={PAD_T} width="67.8" height={PLOT_H} fill="transparent"
              onMouseEnter={() => setHover(d.n)} onMouseLeave={() => setHover(null)} onClick={() => setSelected(d.n)} style={{ cursor: "pointer" }} />
          ))}
        </svg>
        {[
          { t: "UNDER 1 MD. RULLEBANE", l: "16.5%" },
          { t: "BUFFER OG RULLEBANE", l: "45.7%" },
          { t: "KAPITALDREVET FRIHET", l: "79.3%" },
        ].map(z => (
          <div key={z.t} style={{ position: "absolute", top: 14, left: z.l, transform: "translateX(-50%)", fontSize: 11, fontWeight: 600, letterSpacing: ".08em", color: "var(--gray-500)", whiteSpace: "nowrap", pointerEvents: "none" }}>{z.t}</div>
        ))}
        {yTicks.map((v, i) => (
          <div key={i} style={{ position: "absolute", left: "3.6%", top: (yOf(v, mx) / VH * 100) + "%", transform: "translate(-100%,-50%)", fontSize: 12, color: "var(--gray-500)", fontVariantNumeric: "tabular-nums", pointerEvents: "none" }}>{mode === "kumulativ" ? Math.round(v) : v}</div>
        ))}
        {showLines && medianGroups.map((g, i) => (
          <div key={"ml"+g.lv} style={{ position: "absolute", left: (xOf(g.lv) / VW * 100) + "%", top: (labelTop + 3 + i * 3.4) + "%", transform: "translateX(6px)", fontSize: 12, fontWeight: 600, color: "var(--gray-600)", pointerEvents: "none", whiteSpace: "nowrap" }}>
            median {g.keys.map(k => RMETA[k].name).join(" / ")}
          </div>
        ))}
        {showLines && vis.map((k, i) => (
          <div key={"mn"+k} style={{ position: "absolute", left: (xOf(MEANS[k]) / VW * 100) + "%", top: (labelTop + 7 + medianGroups.length * 3.4 + i * 3.2) + "%", transform: "translateX(6px)", fontSize: 12, fontWeight: 600, color: RMETA[k].color, pointerEvents: "none", whiteSpace: "nowrap" }}>
            gj.sn. {RMETA[k].name} {fmtN(MEANS[k])}
          </div>
        ))}
        {showClient && clientLvl != null && (
          <div style={{
            position: "absolute",
            left: (xOf(clientLvl) / VW * 100) + "%",
            top: ((PAD_T + 26) / VH * 100) + "%",
            transform: xOf(clientLvl) / VW * 100 > 62 ? "translateX(-108%)" : "translateX(10px)",
            pointerEvents: "none", zIndex: 4,
          }}>
            <div style={{
              background: "var(--sp-navy)", color: "#fff", borderRadius: 100, padding: "6px 12px 6px 10px",
              boxShadow: "0 12px 24px -6px rgba(16,24,40,.22)",
              display: "flex", alignItems: "center", gap: 8, whiteSpace: "nowrap",
            }}>
              <span style={{ width: 7, height: 7, borderRadius: "50%", background: "var(--blue-400)", flex: "none" }} />
              <span style={{ fontSize: 11, fontWeight: 600, letterSpacing: ".08em", color: "var(--blue-400)" }}>KLIENT</span>
              <span style={{ width: 1, height: 12, background: "rgba(255,255,255,.22)" }} />
              <span style={{ fontSize: 13, fontWeight: 500 }}>Nivå {clientLvl} — {DIST[clientLvl].tittel}</span>
            </div>
          </div>
        )}
        {hover != null && (
          <div style={{ position: "absolute", top: "6%", left: tipLeft + "%", transform: tipFlip ? "translateX(-108%)" : "translateX(8%)",
            background: "#fff", borderRadius: 12, border: "1px solid var(--gray-200)", boxShadow: "0 12px 24px -6px rgba(16,24,40,.14)",

            {vis.map(k => (
              <div key={k} style={{ display: "flex", justifyContent: "space-between", gap: 16, fontSize: 13, padding: "3px 0" }}>

              <div style={{ marginTop: 12, padding: 12, background: "var(--gray-25)", borderRadius: 8, fontSize: 13, color: "var(--gray-700)" }}>Operasjonell terskel: {L.terskel}</div>
              <div style={{ marginTop: 14, display: "flex", flexDirection: "column", gap: 8 }}>

                      <div style={{ width: (maxBar ? L[k] / maxBar * 100 : 0) + "%", height: "100%", background: RMETA[k].color, borderRadius: 100 }} />
                    </div>
                    <span style={Object.assign({ fontSize: 13, textAlign: "right" }, numStyle)}>{fmtPct1(L[k])}</span>
                  </div>

              </div>
              <p style={{ margin: "14px 0 0", fontSize: 13, color: "var(--gray-600)", lineHeight: 1.5 }}>{DIST_NOTES[L.n] || DIST_NOTE_FB}</p>
            </div>
            <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
              {kpi.map(x => (
                <div key={x.k} style={card({ flex: 1, minWidth: 220, padding: 16 })}>

                  </div>
                  <div style={{ fontSize: 12, color: "var(--gray-500)" }}>Medianhusholdningen står på</div>
                  <div style={Object.assign({ fontSize: 30, margin: "2px 0 4px" }, numStyle)}>Nivå {x.lv}</div>
                  <div style={{ fontSize: 13, color: "var(--gray-600)", minHeight: 36 }}>{x.desc}</div>
                  <div style={{ borderTop: "1px solid var(--gray-200)", marginTop: 10, paddingTop: 10, fontSize: 12, color: "var(--gray-600)", display: "flex", flexDirection: "column", gap: 4 }}>
                    <div style={{ display: "flex", justifyContent: "space-between" }}><span>Gjennomsnittsnivå (vektet)</span><span style={numStyle}>{fmtN(MEANS[x.k])}</span></div>
                    <div style={{ display: "flex", justifyContent: "space-between" }}><span>Avvik gj.sn. − median</span><span style={Object.assign({}, numStyle, { color: "var(--chart-violet)" })}>{fmtN(MEANS[x.k] - x.lv)}</span></div>
                    <div style={{ display: "flex", justifyContent: "space-between" }}><span>Under 3 md.</span><span style={numStyle}>{fmtPct1(x.u3)}</span></div>
                    <div style={{ display: "flex", justifyContent: "space-between" }}><span>Reell FI (13+)</span><span style={numStyle}>{fmtPct1(x.fi)}</span></div>
                  </div>
                </div>
              ))}
            </div>
          </div>
      </main>
    </div>
  );
}

RKEYS.forEach(k => {
  const s = colOf(k).reduce((a, p) => a + p, 0);
  if (Math.abs(s - 100) > 0.3) console.error("Kolonnesum " + k + ": " + s);

  const eight = [0,0,0,0,0,0,0,0,100,0,0,0,0,0,0,0,0];
  const m = meanLevel(eight);

const IO_FIELDS = [
  { group: "Forutsetninger", source: "a", key: "age", label: "Alder" },
  { group: "Forutsetninger", source: "a", key: "kpi", label: "KPI" },
  { group: "Forutsetninger", source: "a", key: "portfolio", label: "Avkastning på finansporteføljen" },
  { group: "Forutsetninger", source: "a", key: "annualSave", label: "Årlig sparing" },
  { group: "Forutsetninger", source: "a", key: "passiveAssets", label: "Avkastning på passive eiendeler" },
  { group: "Forutsetninger", source: "a", key: "ownRate", label: "Årlige eierkostnader" },
  { group: "Forutsetninger", source: "a", key: "loanYears", label: "Nedbetalingstid på lånet" },
  { group: "Forutsetninger", source: "a", key: "pension", label: "Avkastning på pensjonskapital" },
  { group: "Forutsetninger", source: "a", key: "otp", label: "Årlig innskudd OTP" },
  { group: "Forutsetninger", source: "a", key: "pensionStart", label: "Når starter utbetaling av pensjon" },
  { group: "Forutsetninger", source: "a", key: "folketrygd", label: "Estimert folketrygd" },
  { group: "Økonomi", source: "s", key: "salary", label: "Brutto lønnsinntekt (årlig)" },
  { group: "Økonomi", source: "s", key: "cost", label: "Månedlige kostnader" },
  { group: "Økonomi", source: "s", key: "liq", label: "Oppsparte midler" },
  { group: "Økonomi", source: "s", key: "assets", label: "Øvrige eiendeler brutto" },
  { group: "Økonomi", source: "s", key: "debt", label: "Total gjeld" },
  { group: "Økonomi", source: "s", key: "rate", label: "Lånerente" },
  { group: "Økonomi", source: "s", key: "taxFree", label: "Skattefrie / andre inntekter (årlig)" },
  { group: "Økonomi", source: "s", key: "pensionCapital", label: "Pensjonskapital (OPT)" },
];
function ioNum(n) {
  if (!Number.isFinite(n)) return "0";
  return String(Math.round(n * 1000) / 1000);
}
function snapshotText(a, s) {
  const lines = [];
  let group = "";
  IO_FIELDS.forEach(f => {
    if (f.group !== group) {
      if (lines.length) lines.push("");
      lines.push("# " + f.group);
      group = f.group;
    }
    const v = f.source === "a" ? a[f.key] : s[f.key];
    lines.push(f.label + ": " + ioNum(num(v)));
  });
  return lines.join("\n");
}
function parseIo(text) {
  const byLabel = {};
  IO_FIELDS.forEach(f => { byLabel[f.label.toLowerCase()] = f; });
  const found = {};
  String(text || "").split(/\r?\n/).forEach(line => {
    const trimmed = line.trim();
    if (!trimmed || trimmed.charAt(0) === "#") return;
    const i = trimmed.indexOf(":");
    if (i < 0) return;
    const field = byLabel[trimmed.slice(0, i).trim().toLowerCase()];
    if (!field) return;
    const raw = trimmed.slice(i + 1).trim().replace(/\s/g, "").replace(",", ".").replace(/kr|%|år/gi, "");
    const n = Number(raw);
    if (Number.isFinite(n)) found[field.key] = { source: field.source, value: n };
  });
  return found;
}

function App() {
  const [tab, setTab] = useState("forside");
  const [assumptions, setAssumptions] = useState(ASSUMPTIONS);
  const [raw, setRaw] = useState(LEVELS[10].p);
  const [ioPanel, setIoPanel] = useState(null);
  const [ioDraft, setIoDraft] = useState("");
  const [ioMsg, setIoMsg] = useState(null);
  const [copied, setCopied] = useState(false);
  const outRef = useRef(null);
  const inRef = useRef(null);
  const s = normalize(Object.assign({}, DEFAULTS, raw, { prate: assumptions.portfolio, ownRate: assumptions.ownRate }));
  if (Math.round(num(assumptions.age)) >= Math.round(num(assumptions.pensionStart))) s.folkPay = Math.max(0, num(assumptions.folketrygd));
  const c = calc(s);
  const lvl = evaluate(s, c);
  const L = LEVELS[lvl];
  const prog = progress(lvl, c);
  const setField = (k, v) => setRaw(prev => Object.assign({}, normalize(prev), { [k]: v }));
  const setAssumption = (k, v) => setAssumptions(prev => Object.assign({}, prev, { [k]: v }));
  const loadLevel = n => setRaw(LEVELS[n].p);
  const standalone = tab === "forside" || tab === "forutsetninger";
  const snapshot = snapshotText(assumptions, s);
  useEffect(() => {
    if (ioPanel === "output" && outRef.current) {
      outRef.current.focus();
      outRef.current.select();
    }
    if (ioPanel === "input" && inRef.current) inRef.current.focus();
  }, [ioPanel]);
  const applySnapshot = (text) => {
    const found = parseIo(text);
    const keys = Object.keys(found);
    if (!keys.length) {
      setIoMsg({ ok: false, text: "Fant ingen kjente verdier. Lim inn teksten fra Output." });
      return;
    }
    const aPatch = {};
    const ePatch = {};
    keys.forEach(k => {
      if (found[k].source === "a") aPatch[k] = found[k].value;
      else ePatch[k] = found[k].value;
    });
    if (Object.keys(aPatch).length) setAssumptions(prev => Object.assign({}, prev, aPatch));
    if (Object.keys(ePatch).length) setRaw(prev => Object.assign({}, normalize(prev), ePatch));
    setIoMsg({ ok: true, text: "La inn " + keys.length + " verdier." });
  };
  const toggleIo = (which) => {
    setIoMsg(null);
    setCopied(false);
    setIoPanel(prev => prev === which ? null : which);
  };
  const copySnapshot = () => {
    const done = () => {
      setCopied(true);
      window.setTimeout(() => setCopied(false), 1600);
    };
    const fallback = () => {
      if (!outRef.current) return;
      outRef.current.focus();
      outRef.current.select();
      document.execCommand("copy");
      done();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(snapshot).then(done).catch(fallback);
    } else fallback();
  };

  return (
    <div style={{ height: "100%", display: "flex", flexDirection: "column", overflow: "hidden", background: "var(--gray-50)", color: "var(--sp-navy)" }}>
      <div style={{ flex: "none", background: "#fff", borderBottom: "1px solid var(--gray-200)" }}>
        <div style={{ maxWidth: 1520, margin: "0 auto", padding: "0 20px", display: "flex", alignItems: "center", gap: 16, minHeight: 52 }}>
          <div style={{ display: "flex", alignItems: "center", minWidth: 0, flex: "none" }}>
            <img src="assets/spwm-logo.svg" alt="Söderberg & Partners Wealth Management" height="22" style={{ height: 22, width: "auto", display: "block" }} />
          </div>
          <div className="app-nav">
            {TABS.map(t => {
              const on = tab === t.id;
              return (
                <button key={t.id} onClick={() => setTab(t.id)} className="app-tab" style={{
                  color: on ? "var(--blue-main)" : "var(--gray-500)",
                  borderBottomColor: on ? "var(--blue-main)" : "transparent",
                }}>
                  <Ico name={t.icon} size={15} /> {t.label}
                </button>
              );
            })}
          </div>
        </div>
      </div>
      <div style={{ maxWidth: tab === 4 ? "none" : 1520, width: "100%", margin: "0 auto", padding: tab === 4 ? 0 : (tab === "forutsetninger" ? "8px 20px 28px" : "22px 20px 28px"), display: "flex", flexDirection: "column", gap: tab === 4 ? 0 : 10, minHeight: 0, flex: 1, overflow: "hidden" }}>
        {tab !== 4 && !standalone && <Hero L={L} prog={prog} />}
        <div style={{ minHeight: 0, flex: 1, overflow: tab === 4 ? "hidden" : "auto", display: "flex", flexDirection: "column", marginTop: tab === 4 || standalone ? 0 : 26 }}>
          {tab === "forside" && <TabForside onStart={() => setTab(0)} loadLevel={loadLevel} />}
          {tab === "forutsetninger" && <TabAssumptions a={assumptions} s={s} c={c} setAssumption={setAssumption} />}
          {tab === 0 && <TabEconomy s={s} c={c} a={assumptions} lvl={lvl} setField={setField} loadLevel={loadLevel} />}
          {tab === 1 && <TabCosts s={s} c={c} />}
          {tab === "fremtid" && <TabFuture s={s} a={assumptions} />}
          {tab === 2 && <TabMatrix s={s} c={c} lvl={lvl} loadLevel={loadLevel} />}
          {tab === 3 && <TabStatus s={s} c={c} lvl={lvl} L={L} prog={prog} />}
          {tab === 4 && <TabNormal clientLvl={lvl} />}
        </div>
      </div>
      <button type="button" className={"io-btn" + (ioPanel === "input" ? " on" : "")} style={{ left: 16 }} onClick={() => toggleIo("input")}>Input</button>
      <button type="button" className={"io-btn" + (ioPanel === "output" ? " on" : "")} style={{ right: 16 }} onClick={() => toggleIo("output")}>Output</button>
      {ioPanel === "input" && (
        <div className="io-panel" style={{ left: 16 }}>
          <div style={{ fontSize: 14, fontWeight: 600 }}>Input</div>
          <div style={{ fontSize: 12, color: "var(--gray-500)", marginTop: 2 }}>Lim inn teksten fra Output. Verdiene legges inn med en gang.</div>
          <textarea
            ref={inRef}
            value={ioDraft}
            placeholder={"# Forutsetninger\nAlder: 45"}
            onChange={e => setIoDraft(e.target.value)}
            onPaste={e => {
              const text = e.clipboardData.getData("text");
              if (!text) return;
              e.preventDefault();
              setIoDraft(text);
              applySnapshot(text);
            }}
          />
          {ioMsg && <div style={{ marginTop: 8, fontSize: 12, color: ioMsg.ok ? "var(--success-700)" : "var(--error-700)" }}>{ioMsg.text}</div>}
        </div>
      )}
      {ioPanel === "output" && (
        <div className="io-panel" style={{ right: 16 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
            <div style={{ fontSize: 14, fontWeight: 600 }}>Output</div>
            <button type="button" onClick={copySnapshot} style={{
              height: 28, padding: "0 12px", borderRadius: 100, border: "none", cursor: "pointer",
              background: copied ? "var(--success-700)" : "var(--blue-main)", color: "#fff",
              fontSize: 12, fontWeight: 600, fontFamily: "inherit",
            }}>{copied ? "Kopiert" : "Kopier"}</button>
          </div>
          <div style={{ fontSize: 12, color: "var(--gray-500)", marginTop: 2 }}>Alle inputverdier. Lim teksten inn via Input.</div>
          <textarea ref={outRef} readOnly value={snapshot} />
        </div>
      )}
    </div>
  );
}

LEVELS.forEach(L => {
  const s = normalize(L.p);
  const got = evaluate(s, calc(s));
  if (got !== L.n) console.error("Nivåavvik: forventet " + L.n + ", fikk " + got);
});

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
