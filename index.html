const nb = n => {
  if (!Number.isFinite(n)) return "–";
  return Math.round(n).toLocaleString("nb-NO").replace(/\u00a0/g, " ");
};
const kr = n => Number.isFinite(n) ? nb(n) + " kr" : "–";
const mkr = n => {
  if (!Number.isFinite(n)) return "–";
  return Math.abs(n) >= 1e6
    ? (n / 1e6).toFixed(Math.abs(n) >= 1e7 ? 1 : 2).replace(".", ",") + " mill."
    : nb(n);
};
const pct = n => Number.isFinite(n) ? n.toFixed(0).replace(".", ",") + " %" : "–";
const pct1 = n => Number.isFinite(n) ? n.toFixed(1).replace(".", ",") + " %" : "–";
const yrs = n => {

  return n.toFixed(1).replace(".", ",") + " år";
};
const signedKr = n => {
  if (!Number.isFinite(n)) return "–";
  if (n > 0) return "+ " + kr(n);
  if (n < 0) return "− " + kr(Math.abs(n));
  return kr(0);
};

function num(v) {
  const n = Number(v);
  return Number.isFinite(n) ? n : 0;
}
function normalize(s) {
  s = s || {};
  return {
    salary: num(s.salary), taxFree: num(s.taxFree), cost: num(s.cost),
    assets: num(s.assets), debt: num(s.debt), rate: num(s.rate),
    liq: num(s.liq), prate: num(s.prate),
  };
}
function calc(s) {
  const own = s.assets * 0.025;
  const interest = s.debt * (s.rate / 100);
  const living = s.cost * 12;
  const totalCost = living + interest + own;
  const passive = s.liq * (s.prate / 100);
  const income = s.salary + s.taxFree + passive;
  const surplus = (income - totalCost) / 12;
  const gross = s.assets + s.liq;
  const equity = gross === 0 ? 0 : ((gross - s.debt) / gross) * 100;
  const ltv = gross === 0 ? 0 : (s.debt / gross) * 100;
  const runway = totalCost === 0 ? (s.liq > 0 ? Infinity : 0) : s.liq / totalCost;
  const passiveCov = totalCost === 0 ? (passive > 0 ? Infinity : 0) : (passive / totalCost) * 100;
  const debtCov = s.debt > 0 ? (s.liq / s.debt) * 100 : Infinity;
  const coverage = totalCost === 0 ? (income > 0 ? Infinity : 0) : (income / totalCost) * 100;
  const salaryShare = income === 0 ? 0 : (s.salary / income) * 100;
  const costOfSalary = s.salary === 0 ? (totalCost > 0 ? Infinity : 0) : (totalCost / s.salary) * 100;
  const costOfIncome = income === 0 ? (totalCost > 0 ? Infinity : 0) : (totalCost / income) * 100;
  const ownShare = income === 0 ? 0 : (own / income) * 100;
  const interestShare = income === 0 ? 0 : (interest / income) * 100;
  const passiveShare = income === 0 ? 0 : (passive / income) * 100;
  return {
    own, interest, living, totalCost, passive, income, surplus, gross, equity, ltv,
    runway, passiveCov, debtCov, coverage, salaryShare, costOfSalary, costOfIncome,
    ownShare, interestShare, passiveShare,
  };
}
function horizon1(s, c) {
  let bal = s.liq, m = 0;
  const fixed = s.cost + (c.interest + c.own) / 12;
  while (bal > 0 && m < 1200) {
    bal += bal * (s.prate / 100) / 12 - fixed;
    m++;
  }
  return m >= 1200 ? 100 : m / 12;
}
function horizon2(c) {
  if (c.totalCost <= 0) return c.passive > 0 ? 100 : 0;
  return c.passive >= c.totalCost ? 100 : c.passive / c.totalCost;
}
function horizon3(s) {
  let bal = Math.max(0, s.assets + s.liq - s.debt), m = 0;
  while (bal > 0 && m < 1200) {
    bal += bal * (s.prate / 100) / 12 - (s.cost + bal * 0.025 / 12);
    m++;
  }
  return m >= 1200 ? 100 : m / 12;
}
function evaluate(s, c) {
  if (c.income === 0 && s.liq === 0) return 0;
  if (s.salary === 0 && s.taxFree === 0 && s.assets === 0 && s.liq < 1e5) return 1;
  if (c.passiveCov >= 300) return s.liq >= 1e8 ? 16 : 15;
  if (c.passiveCov > 150) return 14;
  if (c.passiveCov >= 100) return 13;
  if (c.passiveCov >= 50) return 12;
  if (c.runway >= 8) return 11;
  if (s.salary === 0 && s.taxFree > 0) return 2;
  if (s.salary > 0 && c.coverage < 70) return 3;
  if (c.runway >= 2) return (s.debt > 0 && c.debtCov < 100) ? 9 : 10;
  if (c.runway >= 1 && s.liq >= 500000) return 8;
  if (c.runway >= 0.5) return 7;
  if (c.runway >= 0.25) return 6;
  if (c.runway >= 1 / 12) return 5;
  return 4;
}
function clamp01(x) {
  if (!Number.isFinite(x)) return x === Infinity ? 1 : 0;
  return Math.max(0, Math.min(1, x));
}
function progress(lvl, c) {
  if (lvl <= 3) return clamp01(c.coverage / 100);
  if (lvl === 9) return clamp01((c.debtCov === Infinity ? 100 : c.debtCov) / 100);
  if (lvl >= 11) {
    if (lvl >= 16) return 1;
    const floors = { 11: 0, 12: 50, 13: 100, 14: 150, 15: 300 };
    const ceils = { 11: 50, 12: 100, 13: 150, 14: 300, 15: 300 };
    const lo = floors[lvl], hi = ceils[lvl];
    if (hi === lo) return c.passiveCov >= hi ? 1 : 0;
    return clamp01((c.passiveCov - lo) / (hi - lo));
  }
  const lo = R[lvl], hi = R[lvl + 1];
  if (hi === lo) return (c.runway === Infinity || c.runway >= hi) ? 1 : 0;
  const rw = c.runway === Infinity ? 100 : c.runway;
  return clamp01((rw - lo) / (hi - lo));
}
function nextNeed(s, c, lvl) {
  if (lvl >= 16) return 0;
  if (lvl < 11) return R[lvl + 1] * c.totalCost;
  const k = [0.5, 1.0, 1.5, 3.0, 3.0][lvl - 11];
  const r = s.prate / 100;
  if (r === 0) return Infinity;
  return k * c.totalCost / r;
}
function monthlyCostForNext(s, c, lvl) {
  if (lvl >= 16) return null;
  let maxTotal;
  if (lvl <= 3) {
    const target = lvl === 3 ? 0.7 : 1;
    maxTotal = target === 0 ? 0 : c.income / target;
  } else if (lvl < 11) {
    const rn = R[lvl + 1];
    if (!(rn > 0)) return null;
    maxTotal = s.liq / rn;
  } else {
    const k = [0.5, 1.0, 1.5, 3.0, 3.0][lvl - 11];
    if (!(c.passive > 0) || !(k > 0)) return null;
    maxTotal = c.passive / k;
  }
  return (maxTotal - c.interest - c.own) / 12;
}

function Doughnut({ living, interest, own, total }) {
  const r = 68, C = 2 * Math.PI * r, sw = 40;
  const parts = [
    { v: Math.max(0, living), color: "var(--chart-blue)", label: "Livsopphold" },
    { v: Math.max(0, interest), color: "var(--chart-navy)", label: "Rentekostnad" },
    { v: Math.max(0, own), color: "var(--blue-400)", label: "Eierkostnad 2,5 %" },
  ];
  const sum = parts.reduce((a, p) => a + p.v, 0) || 1;
  let acc = 0;
  return (
    <div style={{ display: "flex", gap: 24, alignItems: "flex-start", flexWrap: "wrap" }}>
      <div style={{ flex: "none", width: 169 }}>
        <svg width="169" height="169" viewBox="0 0 180 180" style={{ transform: "rotate(-90deg)", display: "block" }}>
          <circle cx="90" cy="90" r={r} fill="none" stroke="var(--gray-100)" strokeWidth={sw} />
          {parts.map((p, i) => {
            const dash = (p.v / sum) * C;
            const el = (
              <circle key={i} cx="90" cy="90" r={r} fill="none" stroke={p.color} strokeWidth={sw}
                strokeDasharray={dash + " " + (C - dash)} strokeDashoffset={-acc}
                strokeLinecap="butt" />
            );
            acc += dash;
            return el;
          })}
        </svg>
        <div style={{ marginTop: 12, textAlign: "center" }}>
          <div style={{ fontSize: 11, color: "var(--gray-500)", fontWeight: 600, letterSpacing: ".06em", textTransform: "uppercase" }}>Totalt per år</div>
          <div style={Object.assign({ fontSize: 18, marginTop: 2 }, numStyle)}>{kr(total)}</div>
        </div>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 12, minWidth: 220, flex: 1, paddingTop: 8 }}>
        {parts.map(p => (
          <div key={p.label} style={{ display: "grid", gridTemplateColumns: "12px 1fr auto auto", gap: 10, alignItems: "center" }}>
            <span style={{ width: 12, height: 12, borderRadius: "50%", background: p.color }} />
            <span style={{ fontSize: 14, color: "var(--sp-navy)" }}>{p.label}</span>
            <span style={Object.assign({ fontSize: 15 }, numStyle)}>{kr(p.v)}</span>
            <span style={{ fontSize: 13, color: "var(--gray-500)", minWidth: 48, textAlign: "right" }}>{pct((p.v / sum) * 100)}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

          const h = Math.max(4, (Math.max(0, b.v) / max) * 100);

          <div key={x.n} style={card({ padding: 14 })}>

              <tr>
                <th style={Object.assign({}, th, { textAlign: "left" })}>Nivå</th>

                <th style={th}>Oppsparte midler</th>
                <th style={th}>2</th>
                <th style={th}>Kun passiv inntekt</th>

                <th style={th}>Alle eiendeler</th>

            </thead>

function toneStyle(kind) {
  if (kind === "error") return { bg: "var(--error-bg)", fg: "var(--error-700)" };
  if (kind === "warn") return { bg: "var(--warning-bg)", fg: "var(--warning-700)" };
  if (kind === "ok") return { bg: "var(--success-bg)", fg: "var(--success-700)" };
  return { bg: "var(--blue-50)", fg: "var(--blue-main)" };
}

function TabStatus({ s, c, lvl, L, prog }) {
  const next = LEVELS[Math.min(16, lvl + 1)];
  const need = nextNeed(s, c, lvl);
  const gap = lvl >= 16 ? 0 : (Number.isFinite(need) ? need - s.liq : Infinity);
  const fulfilled = lvl >= 16 || (Number.isFinite(gap) && gap <= 0);
  const costKind = c.costOfIncome > 100 ? "error" : c.costOfIncome > 80 ? "warn" : "ok";
  const costPill = c.costOfIncome > 100 ? "Kritisk" : c.costOfIncome > 80 ? "Prioritet" : "Under kontroll";
  const ltvKind = s.debt === 0 ? "ok" : c.ltv > 70 ? "error" : c.ltv > 40 ? "warn" : "ok";
  const ltvPill = s.debt === 0 ? "Gjeldfri" : c.ltv > 70 ? "Høy" : c.ltv > 40 ? "Moderat" : "Lav";
  const livShare = c.totalCost > 0 ? (c.living / c.totalCost) * 100 : 0;
  const freed = c.living * 0.1;
  const mNext = monthlyCostForNext(s, c, lvl);
  const yearsToClose = c.surplus > 0 && gap > 0 ? gap / (c.surplus * 12) : null;
  const fiNeed = s.prate > 0 ? c.totalCost / (s.prate / 100) : Infinity;
  const plus1rate = s.debt * 0.01;

  const costPoints = [
    "Livsopphold utgjør " + pct(livShare) + " av totale kostnader. Et kutt på 10 % frigjør " + kr(freed) + " per år (" + kr(freed / 12) + " per måned).",
    (mNext == null || !Number.isFinite(mNext))
      ? "Neste nivå styres av kapital og avkastning mer enn av kostnadsnivået alene."
      : mNext <= 0
        ? "Eierkostnad og renter alene overstiger det kostnadsnivået som ville oppfylt neste nivå med dagens oppsparte midler."
        : "Med dagens oppsparte midler ville et månedlig kostnadsnivå på " + kr(mNext) + " alene oppfylt kravet til neste nivå.",
    "Eierkostnaden på " + kr(c.own) + " per år følger eiendelene, ikke inntekten. Den løper uavhengig av lønn.",
  ];
  const debtPoints = s.debt === 0 ? [
    "Ingen gjeld. Renteøkninger treffer ikke husholdningen.",
    "Belåningsgraden er 0 %. Kapitalen er ubelånt.",
    "Gjeldfrihet er allerede oppnådd — kravet til nivå 10 er innfridd på dette punktet.",
  ] : [
    "Gjelden er " + kr(s.debt) + ", tilsvarende " + pct(c.ltv) + " av brutto eiendeler. Rentekostnaden er " + kr(c.interest) + " per år.",
    "Ett prosentpoeng høyere rente koster " + kr(plus1rate) + " mer per år (" + kr(plus1rate / 12) + " per måned).",
    "Oppsparte midler dekker " + (c.debtCov === Infinity ? "all gjeld" : pct(c.debtCov) + " av gjelden") + ". 100 % er kravet til nivå 10.",
  ];
  const savPoints = [
    lvl >= 16
      ? "Kravet til toppen av stigen er innfridd. Videre arbeid handler om forvaltning og formål."
      : "Neste nivå krever " + (Number.isFinite(need) ? kr(need) : "–") + " i oppsparte midler. Gapet er " + (fulfilled ? "lukket" : (Number.isFinite(gap) ? kr(Math.max(0, gap)) : "–")) + ".",
    c.surplus <= 0 && !fulfilled
      ? "Månedlig overskudd er negativt. Gapet lukkes ikke uten inntektsøkning eller kutt i kostnadene."
      : fulfilled
        ? "Kapitalkravet til neste nivå er oppfylt — øvrige kriterier kan fortsatt gjenstå."
        : "Med dagens månedlige overskudd på " + kr(c.surplus) + " lukkes gapet på " + yrs(yearsToClose) + ".",
    "Dagens midler gir " + yrs(horizon1(s, c)) + " uten lønn (horisont 1). Selges alt, er horisonten " + yrs(horizon3(s)) + " (horisont 3).",
  ];
  const incPoints = [
    "Passiv inntekt er " + kr(c.passive) + " per år ved " + pct1(s.prate) + " avkastning og dekker " + pct(c.passiveCov) + " av kostnadene.",
    "Full frihet (100 % dekning) krever " + (Number.isFinite(fiNeed) ? kr(fiNeed) : "positiv avkastning") + " i oppsparte midler ved dagens avkastning.",
    "Lønn utgjør " + pct(c.salaryShare) + " av totale inntekter." + (c.salaryShare > 80 ? " Avhengigheten av lønn er høy." : ""),
  ];

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 10, minHeight: 0, flex: 1 }}>
      <div style={card({ padding: 16, display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(min(100%, 320px), 1fr))", gap: 20, flex: "none" })}>
        <div>
          <Eyebrow color="var(--blue-main)">Beregnet status</Eyebrow>
          <h2 style={{ fontSize: 18, fontWeight: 500, letterSpacing: "-.01em", margin: "6px 0 8px", lineHeight: 1.3 }}>
            {lvl >= 16
              ? "Nivå 16 i dag. Toppen av stigen."
              : "Nivå " + lvl + " i dag. Neste steg er nivå " + next.n + " — " + next.tittel + "."}
          </h2>
          <p style={{ fontSize: 13, lineHeight: 1.45, color: "var(--sp-navy)", margin: 0, textWrap: "pretty" }}>
            Brutto lønnsinntekt er {s.salary === 0 ? "ingen" : kr(s.salary)}. Totale årlige kostnader er {kr(c.totalCost)}. Oppsparte midler er {kr(s.liq)}. Fremdrift mot neste nivå er {pct(prog * 100)}.
          </p>
        </div>
        <div>
          <div style={{ fontSize: 13, fontWeight: 500, marginBottom: 4 }}>
            {lvl >= 16 ? "Kravet for nivå 16 · Generasjonsformue" : "Kravet for nivå " + next.n + " · " + next.tittel}
          </div>
          <div style={{ fontSize: 13, color: "var(--gray-600)", marginBottom: 8 }}>{lvl >= 16 ? L.kriterium : next.kriterium}</div>
          {[
            ["Oppsparte midler i dag", kr(s.liq)],
            ["Behov for neste nivå", lvl >= 16 ? "Oppnådd" : (Number.isFinite(need) ? kr(need) : "–")],
            ["Gap", fulfilled ? "Kravet oppfylt" : (Number.isFinite(gap) ? kr(Math.max(0, gap)) : "–")],
          ].map(([a, b], i) => (
            <div key={a} style={{ display: "flex", justifyContent: "space-between", gap: 12, padding: "5px 0", borderTop: "1px solid var(--gray-100)" }}>
              <span style={{ fontSize: 12, color: "var(--gray-500)" }}>{a}</span>
              <span style={Object.assign({ fontSize: 13, color: i === 2 ? (fulfilled ? "var(--success-700)" : "var(--warning-700)") : "var(--sp-navy)" }, numStyle)}>{b}</span>
            </div>
          ))}
        </div>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(4, minmax(0, 1fr))", gap: 10, flex: 1, minHeight: 0 }}>
        <RecCard icon="receipt" title="Kostnader" kicker="Størst umiddelbar effekt" pill={costPill} kind={costKind}
          points={costPoints} footLabel="Kostnader i % av totale inntekter" footValue={pct(c.costOfIncome)} />
        <RecCard icon="building-house" title="Gjeld og rente" kicker="Reduserer sårbarhet" pill={ltvPill} kind={ltvKind}
          points={debtPoints} footLabel="Gjeldsgrad" footValue={s.debt === 0 ? "Gjeldfri" : pct(c.ltv)} />
        <RecCard icon="line-chart" title="Oppsparte midler" kicker="Bygger rullebane og frihet"
          pill={fulfilled ? "Kravet oppfylt" : ("Gap " + (Number.isFinite(gap) ? mkr(Math.max(0, gap)) + " kr" : "–"))}
          kind={fulfilled ? "ok" : "warn"}
          points={savPoints} footLabel="Rullebane oppsparte midler" footValue={yrs(horizon1(s, c))} />
        <RecCard icon="trending-up" title="Inntekt og avkastning" kicker="Flytter dekningsgraden"
          pill={c.passiveCov >= 100 ? "FI oppnådd" : (pct(c.passiveCov) + " dekket")}
          kind={c.passiveCov >= 100 ? "ok" : "info"}
          points={incPoints} footLabel="Passiv dekningsgrad" footValue={pct(c.passiveCov)} />
      </div>
    </div>
  );
}

const meanLevel = col => {
  const s = col.reduce((a, p) => a + p, 0);
  return s === 0 ? 0 : col.reduce((a, p, i) => a + p * i, 0) / s;
};
const colOf = k => DIST.map(d => d[k]);
const MEANS = { usa: meanLevel(colOf("usa")), europa: meanLevel(colOf("europa")), norden: meanLevel(colOf("norden")), norge: meanLevel(colOf("norge")) };
const fmtPct1 = n => {
  if (!Number.isFinite(n)) return "–";
  const d = Math.abs(n) < 1 ? 2 : 1;
  return n.toFixed(d).replace(".", ",") + "\u00a0%";
};
const fmtN = n => Number.isFinite(n) ? n.toFixed(2).replace(".", ",") : "–";
const catmullPath = pts => {
  if (!pts.length) return "";
  let d = "M " + pts[0][0].toFixed(2) + "," + pts[0][1].toFixed(2);
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    d += " C " + (p1[0] + (p2[0] - p0[0]) / 6).toFixed(2) + "," + (p1[1] + (p2[1] - p0[1]) / 6).toFixed(2) + " "
      + (p2[0] - (p3[0] - p1[0]) / 6).toFixed(2) + "," + (p2[1] - (p3[1] - p1[1]) / 6).toFixed(2) + " "
      + p2[0].toFixed(2) + "," + p2[1].toFixed(2);
  }
  return d;
};
const VW = 1160, VH = 468;
const PAD_L = 56, PAD_R = 20, PAD_T = 78, PAD_B = 22;
const PLOT_R = VW - PAD_R, PLOT_B = VH - PAD_B, PLOT_H = PLOT_B - PAD_T;
const xOf = i => PAD_L + i * (PLOT_R - PAD_L) / 16;
const yOf = (v, mx) => PLOT_B - (v / mx) * PLOT_H;
const seriesOf = (key, mode) => {
  const col = colOf(key);
  if (mode !== "kumulativ") return col;
  let s = 0;
  return col.map(v => (s += v));
};

function NdChip({ on, children, onClick, label }) {

function DistributionChart({ visible, mode, hover, selected, setHover, setSelected, accent, clientLvl, showClient }) {
  const mx = mode === "kumulativ" ? 100 : 20;
  const active = hover != null ? hover : selected;
  const vis = RKEYS.filter(k => visible[k]);
  const showLines = mode !== "kumulativ";
  const pts = k => seriesOf(k, mode).map((v, i) => [xOf(i), yOf(v, mx)]);
  const zone = (a, b) => {
    const x1 = Math.max(PAD_L, xOf(a) - 33.9), x2 = Math.min(PLOT_R, xOf(b) + 33.9);
    return { x: x1, w: x2 - x1 };
  };
  const z0 = zone(0, 4), z1 = zone(5, 9), z2 = zone(10, 16);
  const yTicks = [0, mx * 0.25, mx * 0.5, mx * 0.75, mx];
  const medianGroups = [];
  vis.forEach(k => {
    const lv = MEDIAN_LV[k];
    let g = medianGroups.find(x => x.lv === lv);
    if (!g) { g = { lv, keys: [] }; medianGroups.push(g); }
    g.keys.push(k);
  });
  const onKey = e => {
    if (e.key === "ArrowLeft") { e.preventDefault(); setSelected(Math.max(0, selected - 1)); setHover(null); }
    if (e.key === "ArrowRight") { e.preventDefault(); setSelected(Math.min(16, selected + 1)); setHover(null); }
    if (e.key === "Enter") { e.preventDefault(); setSelected(active); setHover(null); }
  };
  const tipLeft = hover == null ? 0 : xOf(hover) / VW * 100;
  const tipFlip = tipLeft > 62;
  const labelTop = PAD_T / VH * 100;
  return (
    <div style={{ width: "90%", margin: "0 auto" }}>
      <div style={{ position: "relative", overflow: "hidden" }} tabIndex={0} onKeyDown={onKey} aria-label="Fordelingskurve etter nivå. Bruk piltaster for å flytte valgt nivå, Enter for å låse.">
        <svg viewBox={"0 0 " + VW + " " + VH} role="img"
          aria-label={"Fordeling av husholdninger på 17 nivåer for " + vis.map(k => RMETA[k].name).join(", ")}
          style={{ width: "100%", aspectRatio: VW + "/" + VH, height: "auto", display: "block" }}>
          <defs>
            <clipPath id="nd-plot-clip">
              <rect x={PAD_L} y={PAD_T} width={PLOT_R - PAD_L} height={PLOT_H} />
            </clipPath>
          </defs>
          <rect x={z0.x} y={PAD_T} width={z0.w} height={PLOT_H} fill="rgba(253,162,155,.10)" />
          <rect x={z1.x} y={PAD_T} width={z1.w} height={PLOT_H} fill="rgba(10,94,220,.04)" />
          <rect x={z2.x} y={PAD_T} width={z2.w} height={PLOT_H} fill="rgba(38,68,114,.06)" />
          {showClient && clientLvl != null && (() => {
            const x = xOf(clientLvl) - 33.9;
            const x1 = Math.max(PAD_L, x);
            const w = Math.min(PLOT_R, x + 67.8) - x1;
            const cx = xOf(clientLvl);
            return (
              <g pointerEvents="none">
                <rect x={x1} y={PAD_T} width={w} height={PLOT_H} fill="rgba(0,35,89,.10)" />
                <line x1={cx} x2={cx} y1={PAD_T} y2={PLOT_B} stroke="var(--sp-navy)" strokeWidth="1.75" />
                <polygon points={[cx, PAD_T + 2, cx + 6, PAD_T + 10, cx, PAD_T + 18, cx - 6, PAD_T + 10].join(" ")} fill="var(--sp-navy)" />
              </g>
            );
          })()}
          {active != null && !(showClient && active === clientLvl) && (() => {
            const x = xOf(active) - 33.9;
            const x1 = Math.max(PAD_L, x);
            const w = Math.min(PLOT_R, x + 67.8) - x1;
            return <rect x={x1} y={PAD_T} width={w} height={PLOT_H} fill="var(--blue-100)" stroke="var(--blue-300)" strokeWidth="1.5" pointerEvents="none" />;
          })()}
          {yTicks.map(v => {
            const y = yOf(v, mx);
            return <line key={v} x1={PAD_L} x2={PLOT_R} y1={y} y2={y} stroke={v === 0 ? "var(--gray-300)" : "var(--chart-grid)"} strokeWidth="1" />;
          })}
          {showLines && medianGroups.map(g => (
            <line key={"med"+g.lv} x1={xOf(g.lv)} x2={xOf(g.lv)} y1={PAD_T} y2={PLOT_B}
              stroke="var(--gray-600)" strokeWidth="1.5" strokeDasharray="5 5" opacity="0.7" />
          ))}
          {showLines && vis.map(k => (
            <line key={"mean"+k} x1={xOf(MEANS[k])} x2={xOf(MEANS[k])} y1={PAD_T} y2={PLOT_B}
              stroke={RMETA[k].color} strokeWidth="2" strokeDasharray="1.5 4" strokeLinecap="round" opacity="0.9" />
          ))}
          <g clipPath="url(#nd-plot-clip)">
            {vis.map(k => {
              const p = pts(k), d = catmullPath(p), acc = k === accent;
              return (
                <g key={k}>
                  {acc && <path d={d + " L " + xOf(16) + " " + PLOT_B + " L " + PAD_L + " " + PLOT_B + " Z"} fill="rgba(10,94,220,.07)" />}
                  <path d={d} fill="none" stroke={RMETA[k].color} strokeWidth={acc ? 3.4 : 2} strokeLinejoin="round" strokeLinecap="round" />
                </g>
              );
            })}
          </g>
          {active != null && vis.map(k => {
            const v = seriesOf(k, mode)[active];
            return <circle key={"m"+k} cx={xOf(active)} cy={yOf(v, mx)} r="4.5" fill="#fff" stroke={RMETA[k].color} strokeWidth="2.5" />;
          })}
          {showClient && clientLvl != null && vis.map(k => {
            const v = seriesOf(k, mode)[clientLvl];
            return <circle key={"c"+k} cx={xOf(clientLvl)} cy={yOf(v, mx)} r="5.5" fill="#fff" stroke="var(--sp-navy)" strokeWidth="2.2" />;
          })}
          {DIST.map(d => (
            <rect key={d.n} x={xOf(d.n) - 33.9} y={PAD_T} width="67.8" height={PLOT_H} fill="transparent"
              onMouseEnter={() => setHover(d.n)} onMouseLeave={() => setHover(null)} onClick={() => setSelected(d.n)} style={{ cursor: "pointer" }} />
          ))}
        </svg>
        {[
          { t: "UNDER 1 MD. RULLEBANE", l: "16.5%" },
          { t: "BUFFER OG RULLEBANE", l: "45.7%" },
          { t: "KAPITALDREVET FRIHET", l: "79.3%" },
        ].map(z => (
          <div key={z.t} style={{ position: "absolute", top: 14, left: z.l, transform: "translateX(-50%)", fontSize: 11, fontWeight: 600, letterSpacing: ".08em", color: "var(--gray-500)", whiteSpace: "nowrap", pointerEvents: "none" }}>{z.t}</div>
        ))}
        {yTicks.map((v, i) => (
          <div key={i} style={{ position: "absolute", left: "3.6%", top: (yOf(v, mx) / VH * 100) + "%", transform: "translate(-100%,-50%)", fontSize: 12, color: "var(--gray-500)", fontVariantNumeric: "tabular-nums", pointerEvents: "none" }}>{mode === "kumulativ" ? Math.round(v) : v}</div>
        ))}
        {showLines && medianGroups.map((g, i) => (
          <div key={"ml"+g.lv} style={{ position: "absolute", left: (xOf(g.lv) / VW * 100) + "%", top: (labelTop + 3 + i * 3.4) + "%", transform: "translateX(6px)", fontSize: 12, fontWeight: 600, color: "var(--gray-600)", pointerEvents: "none", whiteSpace: "nowrap" }}>
            median {g.keys.map(k => RMETA[k].name).join(" / ")}
          </div>
        ))}
        {showLines && vis.map((k, i) => (
          <div key={"mn"+k} style={{ position: "absolute", left: (xOf(MEANS[k]) / VW * 100) + "%", top: (labelTop + 7 + medianGroups.length * 3.4 + i * 3.2) + "%", transform: "translateX(6px)", fontSize: 12, fontWeight: 600, color: RMETA[k].color, pointerEvents: "none", whiteSpace: "nowrap" }}>
            gj.sn. {RMETA[k].name} {fmtN(MEANS[k])}
          </div>
        ))}
        {showClient && clientLvl != null && (
          <div style={{
            position: "absolute",
            left: (xOf(clientLvl) / VW * 100) + "%",
            top: ((PAD_T + 26) / VH * 100) + "%",
            transform: xOf(clientLvl) / VW * 100 > 62 ? "translateX(-108%)" : "translateX(10px)",
            pointerEvents: "none", zIndex: 4,
          }}>
            <div style={{
              background: "var(--sp-navy)", color: "#fff", borderRadius: 100, padding: "6px 12px 6px 10px",
              boxShadow: "0 12px 24px -6px rgba(16,24,40,.22)",
              display: "flex", alignItems: "center", gap: 8, whiteSpace: "nowrap",
            }}>
              <span style={{ width: 7, height: 7, borderRadius: "50%", background: "var(--blue-400)", flex: "none" }} />
              <span style={{ fontSize: 11, fontWeight: 600, letterSpacing: ".08em", color: "var(--blue-400)" }}>KLIENT</span>
              <span style={{ width: 1, height: 12, background: "rgba(255,255,255,.22)" }} />
              <span style={{ fontSize: 13, fontWeight: 500 }}>Nivå {clientLvl} — {DIST[clientLvl].tittel}</span>
            </div>
          </div>
        )}
        {hover != null && (
          <div style={{ position: "absolute", top: "6%", left: tipLeft + "%", transform: tipFlip ? "translateX(-108%)" : "translateX(8%)",
            background: "#fff", borderRadius: 12, border: "1px solid var(--gray-200)", boxShadow: "0 12px 24px -6px rgba(16,24,40,.14)",
            minWidth: 200, padding: "12px 14px", pointerEvents: "none", zIndex: 5 }}>
            <div style={{ fontSize: 11, fontWeight: 600, letterSpacing: ".08em", color: "var(--gray-500)" }}>NIVÅ {hover}</div>
            <div style={{ fontSize: 14, fontWeight: 500, color: "var(--sp-navy)", margin: "4px 0 10px" }}>{DIST[hover].tittel}</div>
            {vis.map(k => (
              <div key={k} style={{ display: "flex", justifyContent: "space-between", gap: 16, fontSize: 13, padding: "3px 0" }}>
                <span style={{ display: "flex", alignItems: "center", gap: 6 }}><span style={{ width: 8, height: 8, borderRadius: "50%", background: RMETA[k].color }} />{RMETA[k].name}</span>
                <span style={numStyle}>{fmtPct1(seriesOf(k, mode)[hover])}</span>
              </div>
            ))}
          </div>
        )}
      </div>
      <div style={{ display: "flex", marginTop: 4 }}>
        {DIST.map(d => {
          const on = selected === d.n;
          return (
            <button key={d.n} type="button" className="nd-axis" aria-pressed={on} aria-label={"Nivå " + d.n + ", " + d.tittel}
              onClick={() => setSelected(d.n)} onMouseEnter={() => setHover(d.n)} onMouseLeave={() => setHover(null)}
              style={{ flex: 1, height: 26, border: "none", cursor: "pointer", fontFamily: "inherit", fontSize: 13.5, fontWeight: 600,
                background: on ? "var(--blue-100)" : (showClient && d.n === clientLvl ? "rgba(0,35,89,.08)" : "transparent"),
                color: (on || hover === d.n) ? "var(--blue-main)" : (showClient && d.n === clientLvl ? "var(--sp-navy)" : "var(--sp-navy)"),
                borderRadius: 6, boxShadow: showClient && d.n === clientLvl ? "inset 0 -2px 0 var(--sp-navy)" : "none" }}>
              {d.n}
            </button>
          );
        })}
      </div>
      <div style={{ textAlign: "center", fontSize: 13.5, fontWeight: 600, color: "var(--sp-navy)", marginTop: 4 }}>
        Nivå {active} — {DIST[active].tittel}
      </div>
    </div>
  );
}

function TabNormal({ clientLvl }) {
  const saved = (() => { try { return JSON.parse(localStorage.getItem("likvid-sannhet-dashboard")) || {}; } catch (e) { return {}; } })();
  const [mode, setMode] = useState(saved.mode || "andel");
  const [selected, setSelected] = useState(saved.selected != null ? saved.selected : 6);
  const [visible, setVisible] = useState(saved.visibleRegions || { usa: true, europa: true, norden: true, norge: true });
  const [hover, setHover] = useState(null);
  const [showClient, setShowClient] = useState(saved.showClient != null ? saved.showClient : false);
  const [accent] = useState("norge");
  useEffect(() => {
    localStorage.setItem("likvid-sannhet-dashboard", JSON.stringify({ mode, selected, visibleRegions: visible, showClient }));
  }, [mode, selected, visible, showClient]);
  const toggleR = k => setVisible(v => {
    const n = Object.assign({}, v, { [k]: !v[k] });
    return RKEYS.some(x => n[x]) ? n : v;
  });
  const L = DIST[selected];
  const zone = selected <= 4 ? { t: "Under 1 md. rullebane", bg: "var(--error-bg)", fg: "var(--error-700)" }
    : selected <= 9 ? { t: "Buffer og rullebane", bg: "var(--blue-100)", fg: "var(--blue-main)" }
    : { t: "Kapitaldrevet frihet", bg: "var(--secondary-100)", fg: "var(--secondary-800)" };
  const maxBar = Math.max.apply(null, RKEYS.map(k => L[k]));
  const kpi = [
    { k: "usa", lv: 5, desc: "Liten buffer — bimodal, tykk hale", u3: 45.0, fi: 6.00 },
    { k: "europa", lv: 6, desc: "Trygg hverdag, nedre del", u3: 42.0, fi: 2.70 },
    { k: "norden", lv: 6, desc: "Trygg hverdag — bredt midtplatå", u3: 37.5, fi: 1.55 },
    { k: "norge", lv: 6, desc: "Trygg hverdag — 217 000 kr disponibelt", u3: 33.6, fi: 1.50 },
  ];

  return (
    <div style={{ display: "flex", flex: 1, minHeight: 0, overflow: "hidden", background: "var(--gray-50)" }}>
      <main style={{ flex: 1, minWidth: 0, overflow: "auto", background: "var(--gray-50)", padding: "24px 28px 40px", display: "flex", flexDirection: "column", gap: 20 }}>
        <h1 style={{ margin: 0, fontSize: 28, fontWeight: 500, letterSpacing: "-.01em", color: "var(--sp-navy)", lineHeight: 1.2 }}>Internasjonal fordeling på nivå 0–17</h1>
          <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
            <div style={card({ padding: 20 })}>
              <div style={{ display: "flex", justifyContent: "space-between", gap: 12, flexWrap: "wrap", marginBottom: 12 }}>
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                  {RKEYS.map(k => (
                    <NdChip key={k} on={visible[k]} onClick={() => toggleR(k)} label={RMETA[k].name}>
                      <span style={{ width: 20, height: 3, background: RMETA[k].color, borderRadius: 2 }} /> {RMETA[k].name}
                    </NdChip>
                  ))}
                  <NdChip on={showClient} onClick={() => { setShowClient(v => !v); if (!showClient && clientLvl != null) setSelected(clientLvl); }} label="Klient">
                    <span style={{ width: 8, height: 8, borderRadius: "50%", background: "var(--sp-navy)", boxShadow: showClient ? "0 0 0 3px rgba(0,35,89,.14)" : "none" }} /> Klient
                  </NdChip>
                </div>
                <div style={{ display: "inline-flex", padding: 3, background: "var(--gray-100)", borderRadius: 5, gap: 2 }}>
                  {[{ id: "andel", t: "Andel per nivå" }, { id: "kumulativ", t: "Kumulativ" }].map(m => (
                    <button key={m.id} type="button" aria-pressed={mode === m.id} onClick={() => setMode(m.id)}
                      style={{ height: 28, padding: "0 12px", border: "none", borderRadius: 4, cursor: "pointer", fontFamily: "inherit", fontSize: 13, fontWeight: 500,
                        background: mode === m.id ? "#fff" : "transparent", color: "var(--sp-navy)", boxShadow: mode === m.id ? "0 1px 2px rgba(16,24,40,.06)" : "none" }}>{m.t}</button>
                  ))}
                </div>
              </div>
              <DistributionChart visible={visible} mode={mode} hover={hover} selected={selected} setHover={setHover} setSelected={setSelected} accent={accent} clientLvl={clientLvl} showClient={showClient} />
              {mode !== "kumulativ" && (
                <div style={{ marginTop: 14, padding: "10px 14px", background: "var(--gray-25)", border: "1px solid var(--gray-200)", borderRadius: 8 }}>
                  <div style={{ fontSize: 12, fontWeight: 600, letterSpacing: ".08em", color: "var(--gray-500)", marginBottom: 8 }}>MEDIAN OG VEKTET GJENNOMSNITTSNIVÅ</div>
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 8 }}>
                    {RKEYS.filter(k => visible[k]).map(k => (
                      <span key={k} style={{ fontSize: 13, color: "var(--sp-navy)", display: "inline-flex", alignItems: "center", gap: 6 }}>
                        <span style={{ width: 14, borderTop: "2px dotted " + RMETA[k].color }} /> {RMETA[k].name} · median {MEDIAN_LV[k]} · gj.sn. {fmtN(MEANS[k])}
                      </span>
                    ))}
                  </div>
                  <p style={{ margin: 0, fontSize: 13, color: "var(--gray-600)", lineHeight: 1.5 }}>
                    Gjennomsnittet ligger over medianen fordi halen på nivå 10–16 trekker tyngdepunktet oppover — mest i USA, der medianen står på nivå 5 og gjennomsnittet på {fmtN(MEANS.usa)}. Retningen er den samme som i kroner (USA 696 277 mot 69 000 USD, 10:1; eurosonen 312 000 mot 140 100 €), men utslaget dempes fordi nivåskalaen er ordinal, ikke lineær i kroner.
                  </p>
                </div>
              )}
              <div style={{ display: "flex", justifyContent: "space-between", gap: 12, flexWrap: "wrap", marginTop: 10, fontSize: 11.5, color: "var(--gray-400)" }}>
                <span>Nivå 0–16 · husholdningsvektet andel · stiplet linje = median, punktert = vektet gjennomsnittsnivå (Σ andel × nivå)</span>
                <span>Kilde: Fed SHED 2025, ECB HFCS 2023, Eurostat 2024, SSB 2024 — modellestimater</span>
              </div>
            </div>
            <div style={card({ padding: 20 })}>
              <div style={{ fontSize: 12, fontWeight: 600, letterSpacing: ".08em", color: "var(--gray-500)" }}>VALGT NIVÅ</div>
              <div style={{ fontSize: 20, fontWeight: 500, margin: "6px 0 8px" }}>Nivå {L.n} — {L.tittel}</div>
              <span style={{ display: "inline-block", background: zone.bg, color: zone.fg, fontSize: 12, fontWeight: 500, padding: "4px 10px", borderRadius: 100 }}>{zone.t}</span>
              <div style={{ marginTop: 12, padding: 12, background: "var(--gray-25)", borderRadius: 8, fontSize: 13, color: "var(--gray-700)" }}>Operasjonell terskel: {L.terskel}</div>
              <div style={{ marginTop: 14, display: "flex", flexDirection: "column", gap: 8 }}>
                {RKEYS.map(k => (
                  <div key={k} style={{ display: "grid", gridTemplateColumns: "82px 1fr 56px", gap: 8, alignItems: "center" }}>
                    <span style={{ fontSize: 13 }}>{RMETA[k].name}</span>
                    <div style={{ height: 10, background: "var(--gray-100)", borderRadius: 100, overflow: "hidden" }}>
                      <div style={{ width: (maxBar ? L[k] / maxBar * 100 : 0) + "%", height: "100%", background: RMETA[k].color, borderRadius: 100 }} />
                    </div>
                    <span style={Object.assign({ fontSize: 13, textAlign: "right" }, numStyle)}>{fmtPct1(L[k])}</span>
                  </div>
                ))}
              </div>
              <p style={{ margin: "14px 0 0", fontSize: 13, color: "var(--gray-600)", lineHeight: 1.5 }}>{DIST_NOTES[L.n] || DIST_NOTE_FB}</p>
            </div>
            <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
              {kpi.map(x => (
                <div key={x.k} style={card({ flex: 1, minWidth: 220, padding: 16 })}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
                    <span style={{ width: 8, height: 8, borderRadius: "50%", background: RMETA[x.k].color }} />
                    <span style={{ fontSize: 14, fontWeight: 500 }}>{RMETA[x.k].name}</span>
                  </div>
                  <div style={{ fontSize: 12, color: "var(--gray-500)" }}>Medianhusholdningen står på</div>
                  <div style={Object.assign({ fontSize: 30, margin: "2px 0 4px" }, numStyle)}>Nivå {x.lv}</div>
                  <div style={{ fontSize: 13, color: "var(--gray-600)", minHeight: 36 }}>{x.desc}</div>
                  <div style={{ borderTop: "1px solid var(--gray-200)", marginTop: 10, paddingTop: 10, fontSize: 12, color: "var(--gray-600)", display: "flex", flexDirection: "column", gap: 4 }}>
                    <div style={{ display: "flex", justifyContent: "space-between" }}><span>Gjennomsnittsnivå (vektet)</span><span style={numStyle}>{fmtN(MEANS[x.k])}</span></div>
                    <div style={{ display: "flex", justifyContent: "space-between" }}><span>Avvik gj.sn. − median</span><span style={Object.assign({}, numStyle, { color: "var(--chart-violet)" })}>{fmtN(MEANS[x.k] - x.lv)}</span></div>
                    <div style={{ display: "flex", justifyContent: "space-between" }}><span>Under 3 md.</span><span style={numStyle}>{fmtPct1(x.u3)}</span></div>
                    <div style={{ display: "flex", justifyContent: "space-between" }}><span>Reell FI (13+)</span><span style={numStyle}>{fmtPct1(x.fi)}</span></div>
                  </div>
                </div>
              ))}
            </div>
          </div>
      </main>
    </div>
  );
}

RKEYS.forEach(k => {
  const s = colOf(k).reduce((a, p) => a + p, 0);
  if (Math.abs(s - 100) > 0.3) console.error("Kolonnesum " + k + ": " + s);
});
(function () {
  const eight = [0,0,0,0,0,0,0,0,100,0,0,0,0,0,0,0,0];
  const m = meanLevel(eight);
  if (Math.abs(m - 8) > 0.001) console.error("meanLevel forventet 8, fikk " + m);
})();


function App() {
  const [tab, setTab] = useState("forside");
  const [raw, setRaw] = useState(LEVELS[10].p);
  const s = normalize(Object.assign({}, DEFAULTS, raw));
  const c = calc(s);
  const lvl = evaluate(s, c);
  const L = LEVELS[lvl];
  const prog = progress(lvl, c);
  const setField = (k, v) => setRaw(prev => Object.assign({}, normalize(prev), { [k]: v }));
  const loadLevel = n => setRaw(LEVELS[n].p);

  return (
    <div style={{ height: "100%", display: "flex", flexDirection: "column", overflow: "hidden", background: "var(--gray-50)", color: "var(--sp-navy)" }}>
      <div style={{ flex: "none", background: "#fff", borderBottom: "1px solid var(--gray-200)" }}>
        <div style={{ maxWidth: 1520, margin: "0 auto", padding: "0 20px", display: "flex", alignItems: "center", gap: 16, minHeight: 52 }}>
          <div style={{ display: "flex", alignItems: "center", minWidth: 0, flex: "none" }}>
            <img src="assets/spwm-logo.svg" alt="Söderberg & Partners Wealth Management" height="22" style={{ height: 22, width: "auto", display: "block" }} />
          </div>
          <div style={{ display: "flex", gap: 2, overflowX: "auto", flex: 1, justifyContent: "center" }}>
            {TABS.map(t => {
              const on = tab === t.id;
              return (
                <button key={t.id} onClick={() => setTab(t.id)} style={{
                  display: "inline-flex", alignItems: "center", gap: 6, padding: "14px 14px",
                  background: "transparent", border: "none", cursor: "pointer",
                  color: on ? "var(--blue-main)" : "var(--gray-500)",
                  fontSize: 13, fontWeight: 500, whiteSpace: "nowrap",
                  borderBottom: on ? "2px solid var(--blue-main)" : "2px solid transparent",
                  transition: "color .15s ease-out, border-color .15s ease-out",
                }}>
                  <Ico name={t.icon} size={16} /> {t.label}
                </button>
              );
            })}
          </div>
        </div>
      </div>
      <div style={{ maxWidth: tab === 4 ? "none" : 1520, width: "100%", margin: "0 auto", padding: tab === 4 ? 0 : "22px 20px 28px", display: "flex", flexDirection: "column", gap: tab === 4 ? 0 : 10, minHeight: 0, flex: 1, overflow: "hidden" }}>
        {tab !== 4 && tab !== "forside" && <Hero L={L} prog={prog} />}
        <div style={{ minHeight: 0, flex: 1, overflow: tab === 4 ? "hidden" : "auto", display: "flex", flexDirection: "column", marginTop: tab === 4 || tab === "forside" ? 0 : 26 }}>
          {tab === "forside" && <TabForside onStart={() => setTab(0)} loadLevel={loadLevel} />}
          {tab === 0 && <TabEconomy s={s} c={c} lvl={lvl} setField={setField} loadLevel={loadLevel} />}
          {tab === 1 && <TabCosts s={s} c={c} />}
          {tab === 2 && <TabMatrix s={s} c={c} lvl={lvl} loadLevel={loadLevel} />}
          {tab === 3 && <TabStatus s={s} c={c} lvl={lvl} L={L} prog={prog} />}
          {tab === 4 && <TabNormal clientLvl={lvl} />}
        </div>
        {tab !== 4 && tab !== "forside" && <Footnote />}
      </div>
    </div>
  );
}

LEVELS.forEach(L => {
  const s = normalize(L.p);
  const got = evaluate(s, calc(s));
  if (got !== L.n) console.error("Nivåavvik: forventet " + L.n + ", fikk " + got);
});

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
